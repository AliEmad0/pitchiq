<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Records Gallery</title>
<!--
  TASK-1812 — the Records page (/game/records), the "📊 Records" collection surface on the
  /game arcade gate. 30 LAYOUT concepts, each in a DESKTOP (1000px) and a MOBILE (380px) frame.
  Sample data is shaped exactly like what the app will hold: a career log of full-time results
  kept from now on, the finished runs (seasons, Classic/Survival, ladder weeks, Market runs), and
  what can be derived from the stores that already exist (daily streaks, What-If rescues).
  Three data states — Full career, Sparse (a new coach, 3 matches), Empty — because a new coach
  sees the last two first. Playable: filter by mode, tap a record or a match to see its line.
  LAYOUT ONLY — no motion this round beyond hover. Built from template.html by build.py.
-->
<style>
:root{--ui:#0f0d17;--ui-fg:#ece9f5;--ui-mut:#8f8aa3;--ui-line:#2a2638}
body[data-theme=light]{--bg:#f6f5f9;--fg:#15121e;--card:#fff;--card2:#f0eef5;--mut:#5d5a70;--line:#e2dfea;--pri:#a3179a;--pri-fg:#fff;--up:#15803d;--down:#c0262d;--draw:#a16207;--gold:#a77a08;--pitch:#2f7d3b;--paper:#f4efe3;--ink:#1d1a14}
body[data-theme=dark]{--bg:#0e0c15;--fg:#f2f0f8;--card:#1a1726;--card2:#221e31;--mut:#a29eb5;--line:#302b42;--pri:#d946c8;--pri-fg:#fff;--up:#4ade80;--down:#f87171;--draw:#facc15;--gold:#f2c14e;--pitch:#1d5428;--paper:#201c16;--ink:#ece3cf}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ui);color:var(--ui-fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.top-sticky{position:sticky;top:0;z-index:10}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:9px 16px;background:#14111ef5;border-bottom:1px solid var(--ui-line)}
.bar h1{font-size:15px;margin:0 6px 0 0}
.seg{display:flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--ui-mut);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:#2b2640;color:#fff}
.nav{display:flex;gap:6px;align-items:center}
.nav button,.pickbar button{background:#1d1929;color:#fff;border:1px solid var(--ui-line);border-radius:8px;padding:5px 10px;cursor:pointer}
select{background:#1d1929;color:#fff;border:1px solid var(--ui-line);border-radius:8px;padding:5px 8px;font:inherit;max-width:280px}
.pickbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:7px 16px;background:#1b1628f2;border-bottom:1px solid var(--ui-line);font-size:13px}
.pickbar b{color:#fff}.pickbar .p{color:#86efac}
main{padding:16px;max-width:1500px;margin:0 auto}
.chead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:4px 0 6px}
.chead h2{margin:0;font-size:18px}
.chead h2 b{display:inline-block;min-width:38px;color:#fff;background:#2b2640;border-radius:6px;padding:1px 8px;margin-right:8px;text-align:center}
.why{color:var(--ui-mut);margin:0 0 10px;max-width:980px}
.pickbtn{background:#86efac;color:#052e16;border:0;border-radius:999px;padding:7px 16px;font-weight:800;cursor:pointer}
.pickbtn.on{background:#14532d;color:#bbf7d0;outline:2px solid #86efac}
.stage{overflow:hidden}
.frames{display:flex;gap:24px;align-items:flex-start;width:1404px;transform-origin:0 0}
.tag{font:11px/1 system-ui;color:var(--ui-mut);margin:0 0 6px}
.fr{background:var(--bg);color:var(--fg);border-radius:14px;border:1px solid var(--ui-line);padding:16px;overflow:hidden;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.fr.d{width:1000px}.fr.m{width:380px;padding:16px}
.intro{color:var(--ui-mut);max-width:980px;margin:0 0 10px}

/* ════ eras (src/utils/era.ts) — the accent re-skins per era, as data-era does in the app ════ */
.fr[data-era=retro90s]{--acc:#ef4444}
.fr[data-era=goldenMillennium]{--acc:#f6c000}
.fr[data-era=modern]{--acc:#35e0ff}

/* ── shared atoms ── */
.fr .mut{color:var(--mut)}
.fr .num{font-variant-numeric:tabular-nums}
.fr .cr{object-fit:contain;flex:none;vertical-align:middle}
.fr .badge{display:inline-grid;place-items:center;border-radius:50%;flex:none;vertical-align:middle;line-height:1}
.fr button{cursor:pointer}
.fr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fr .res{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font:800 11px ui-monospace,monospace;color:#fff;flex:none}
.fr .res.W{background:#16a34a}.fr .res.D{background:#a16207}.fr .res.L{background:#dc2626}
.fr .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.fr .tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px}
.fr .tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
.fr .det{display:block;margin-top:4px;font-size:12px;color:var(--mut)}
.fr .emp{border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center}
.fr .emp b{display:block;font-size:17px;margin-bottom:6px}
.fr .cta{display:inline-block;margin-top:12px;background:var(--acc);color:#111;border:0;border-radius:999px;padding:8px 18px;font-weight:800}
.fr .hit{all:unset;display:block;cursor:pointer;width:100%;box-sizing:border-box}
.fr .hit:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fr .hit:hover{filter:brightness(1.08)}
.fr .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fr.m .grid{grid-template-columns:1fr 1fr}
.fr .clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* 1 Career Programme */
.p1-cover{background:linear-gradient(135deg,#7f1d1d,#1e1b4b);color:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.p1-cover .mut{color:#e5e7eb}
.p1-issue{margin-top:10px;font:800 11px/1 ui-monospace,monospace;letter-spacing:.14em;opacity:.8}
.p1-feat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fr.m .p1-feat{grid-template-columns:1fr 1fr}
.p1-r{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.p1-k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.p1-v{display:block;font-size:24px;font-weight:900;font-family:Georgia,serif}
.p1-s{display:block;font-size:11px}
.p1-h{font-family:Georgia,serif;margin:16px 0 8px;border-bottom:3px double var(--line);padding-bottom:4px}
.p1-m{padding:6px 0;border-bottom:1px solid var(--line)}
/* 2 Record Book Ledger */
.p2-book{background:var(--paper);color:var(--ink);border-radius:8px;padding:16px;background-image:repeating-linear-gradient(transparent 0 27px,rgba(80,120,200,.18) 27px 28px);font-family:Georgia,serif}
.p2-title{font-size:20px;font-weight:700;border-bottom:2px solid #b91c1c;margin-bottom:8px;padding-bottom:4px}
.p2-line{padding:4px 0}
.p2-dots{flex:1;border-bottom:2px dotted currentColor;opacity:.4;margin:0 6px;min-width:20px}
.p2-h{font-size:15px;margin:14px 0 6px;font-variant:small-caps}
.p2-cols{display:grid;grid-template-columns:60px 24px 1fr 44px 20px;gap:6px}
.K2 .mut{color:inherit;opacity:.7}
/* 3 Stat Card Wall */
.p3-wall{margin-top:14px}
.p3-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:92px}
.p3-hero{background:linear-gradient(160deg,var(--acc),#7c3aed);color:#111}
.p3-hero .mut{color:#1f2937}
.p3-v{display:block;font-size:30px;font-weight:900}
.p3-k{display:block;font-weight:700;font-size:13px}
.p3-m{padding:5px 0}
/* 4 Career Timeline */
.p4-line{border-inline-start:3px solid var(--line);margin:6px 0 0 8px;padding-inline-start:16px}
.p4-node{position:relative;padding:6px 0}
.p4-node::before{content:"";position:absolute;left:-23px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--line)}
.p4-big{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.p4-big::before{background:var(--acc);width:15px;height:15px;left:-26px}
.p4-big b,.p4-big span{display:block}
/* 5 Broadcast */
.p5-strap{display:flex;gap:12px;align-items:center;background:#dc2626;color:#fff;font:900 13px/1 system-ui;letter-spacing:.08em;padding:10px 12px;border-radius:6px;flex-wrap:wrap}
.p5-b{background:#facc15;color:#111;padding:4px 8px;border-radius:3px}.p5-n{margin-left:auto}
.p5-big{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.fr.m .p5-big{grid-template-columns:1fr 1fr}
.p5-box{background:#111827;color:#fff;border-bottom:4px solid #facc15;border-radius:6px;padding:10px;text-align:center}
.p5-box .det{color:#cbd5e1}
.p5-v{display:block;font-size:28px;font-weight:900}.p5-k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.p5-row{display:grid;grid-template-columns:28px 1fr 70px 1fr;gap:8px;align-items:center;background:linear-gradient(90deg,#1e3a8a,#111827);color:#fff;padding:7px 10px;margin:4px 0;border-radius:4px}
.fr.m .p5-row{grid-template-columns:24px 1fr 56px}
.fr.m .p5-best{display:none}
.p5-best{color:#facc15}
.p5-tick{display:flex;gap:4px;align-items:center;background:#facc15;color:#111;font:900 11px system-ui;padding:6px 10px;border-radius:4px;flex-wrap:wrap}
/* 6 Trading Card Back */
.p6-card{background:#fef3c7;color:#1c1917;border:6px solid #b45309;border-radius:14px;padding:14px;font-family:ui-monospace,Menlo,monospace}
.p6-top{display:flex;gap:10px;align-items:center;border-bottom:2px solid #b45309;padding-bottom:8px;margin-bottom:8px}
.p6-sub{font-size:10px;letter-spacing:.1em}
.p6-t{font-size:12px}.p6-t th{text-align:left;border-bottom:1px solid #b45309}.p6-t td{padding:3px 2px}
.p6-tot td{border-top:2px solid #b45309;font-weight:800}
.p6-note{margin-top:8px;font-size:12px;background:#fde68a;padding:8px;border-radius:6px}
.p6-note .mut{color:#57534e}
.p6-blank{padding:24px 0;text-align:center}
/* 7 Arcade */
.p7-cab{background:#05030a;color:#f0abfc;border:3px solid #a21caf;border-radius:14px;padding:14px;font-family:ui-monospace,Menlo,monospace;box-shadow:inset 0 0 40px rgba(217,70,239,.25)}
.p7-mq{text-align:center;font:900 20px/1 ui-monospace,monospace;color:#facc15;letter-spacing:.16em;margin-bottom:12px;text-shadow:0 0 10px #f59e0b}
.p7-row{display:grid;grid-template-columns:44px 1fr 70px 40px;gap:8px;padding:5px 0;color:#67e8f9}
.p7-row:nth-child(odd){color:#f0abfc}
.p7-sc{text-align:right;color:#fff}.p7-in{color:#facc15}
.p7-form{margin:10px 0;display:flex;gap:3px}
.p7-coin{text-align:center;padding:30px 0;color:#facc15;font-weight:900;letter-spacing:.1em}
.p7-coin span{color:#67e8f9;font-size:12px}
.K7 .tabs button{background:#1e1b4b;color:#e9d5ff;border-color:#6d28d9}
.p7-log .mut{color:#a78bfa}
/* 8 Plaques */
.p8-plq{background:linear-gradient(160deg,#d4a64a,#8a6417);color:#2a1c03;border-radius:6px;padding:12px;text-align:center;box-shadow:inset 0 0 0 2px #f2d98a,0 4px 10px rgba(0,0,0,.35);font-family:Georgia,serif}
.p8-blank{background:linear-gradient(160deg,#a8a29e,#57534e);color:#1c1917}
.p8-k{display:block;font-size:10px;letter-spacing:.14em}.p8-v{display:block;font-size:26px;font-weight:900}.p8-s{display:block;font-size:11px}
.p8-plq .det{color:#3b2a06}
/* 9 Almanac */
.p9-paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:16px;font-family:Georgia,serif}
.p9-mast{border-top:4px solid currentColor;border-bottom:1px solid currentColor;text-align:center;font:900 22px/1.2 Georgia,serif;letter-spacing:.06em;padding:6px 0;margin-bottom:10px}
.p9-mast span{display:block;font:italic 12px Georgia,serif;letter-spacing:0}
.p9-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fr.m .p9-cols{grid-template-columns:1fr}
.p9-cols h4{margin:0 0 6px;border-bottom:1px solid currentColor;font-variant:small-caps}
.p9-fact{font-size:13px;margin:0 0 6px}
.p9-agate{font:12px/1.4 ui-monospace,monospace}
.K9 .mut{color:inherit;opacity:.7}
.p9-lede{font-style:italic}
/* 10 League table */
.p10-strip{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.p10-chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;width:auto;flex:1 1 110px}
.p10-chip b{display:block;font-size:18px}
.p10-t{font-size:13px}.p10-t th{text-align:left;color:var(--mut);font-size:11px;border-bottom:1px solid var(--line);padding:4px}
.p10-t td{padding:6px 4px;border-bottom:1px solid var(--line)}
.p10-t tr:nth-child(2) td{background:color-mix(in srgb,var(--acc) 15%,transparent)}
/* 11 Ticker */
.p11-term{background:#020617;color:#e2e8f0;border:1px solid #1e293b;border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,monospace}
.p11-sym{color:#38bdf8;font-size:12px}
.p11-px{font-size:40px;font-weight:900}
.p11-ch{background:#14532d;color:#86efac;border-radius:6px;padding:2px 8px;font-size:12px}
.p11-bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin:10px 0 4px}
.p11-bar{flex:1;height:var(--h);min-width:0;border:0;border-radius:2px 2px 0 0;padding:0}
.p11-bar.W{background:#22c55e}.p11-bar.D{background:#eab308}.p11-bar.L{background:#ef4444}
.p11-mv{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.fr.m .p11-mv{grid-template-columns:1fr}
.p11-mv h4{margin:0 0 6px;color:#94a3b8;font-size:11px;text-transform:uppercase}
.p11-term .mut,.p11-term .det{color:#94a3b8}
/* 12 Teletext */
.p12-tt{background:#000;color:#fff;font:15px/1.35 ui-monospace,"Courier New",monospace;padding:10px;border-radius:4px}
.fr.m .p12-tt{font-size:12px}
.p12-hd{display:flex;justify-content:space-between;background:#00f;color:#ff0;padding:2px 6px}
.p12-y{color:#ff0;margin:6px 0 2px}.p12-c{color:#0ff}
.p12-row{display:flex;justify-content:space-between;gap:8px}
.p12-fx{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.p12-fx button{border:0;font:inherit;font-weight:700;padding:3px 0}
.p12-r{background:#f00;color:#fff}.p12-g{background:#0f0;color:#000}.p12-y{background:none}.p12-fx .p12-y{background:#ff0;color:#000}.p12-fx .p12-c{background:#0ff;color:#000}
.p12-fx button[aria-pressed=true]{outline:2px solid #fff}
.p12-tt .det{color:#0ff}
/* 13 Scouting report */
.p13-clip{position:relative;background:#7c4a1e;border-radius:12px;padding:26px 12px 12px}
.p13-cl{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:110px;height:22px;background:linear-gradient(#cbd5e1,#64748b);border-radius:6px}
.p13-paper{background:#fffdf6;color:#1f2937;border-radius:4px;padding:14px;font-family:"Courier New",ui-monospace,monospace}
.p13-t{font-weight:900;border-bottom:2px solid #1f2937;margin-bottom:8px}
.p13-paper h4{margin:12px 0 4px;text-decoration:underline}
.p13-li{font-size:13px;margin:3px 0}
.K13 .p13-paper .mut{color:#4b5563}
/* 14 Passport */
.p14-pp{background:#1e3a5f;border-radius:14px;padding:12px;color:#f1f5f9}
.p14-photo{display:flex;gap:12px;align-items:center;background:#f8fafc;color:#0f172a;border-radius:8px;padding:10px}
.p14-lab{font-size:9px;letter-spacing:.14em;color:#64748b;text-transform:uppercase;display:block}
.p14-recs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.fr.m .p14-recs{grid-template-columns:1fr 1fr}
.p14-rec{background:#f8fafc;color:#0f172a;border-radius:6px;padding:6px}
.p14-rec .det{color:#475569}
.p14-page{background:#f8fafc;color:#0f172a;border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;min-height:120px;align-items:center}
.p14-stamp{display:flex;flex-direction:column;align-items:center;border:3px double #b91c1c;color:#b91c1c;border-radius:10px;padding:6px 10px;transform:rotate(var(--r));font:700 11px/1.2 ui-monospace,monospace;text-align:center;max-width:150px}
.p14-stamp b{font-size:16px}
/* 15 Heat calendar */
.p15-rail{display:flex;gap:6px;overflow:hidden;flex-wrap:wrap;margin:12px 0}
.p15-chip{flex:1 1 100px;width:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.p15-chip b{display:block;font-size:18px}.p15-chip span{font-size:11px}
.p15-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.p15-day{aspect-ratio:1;border:0;border-radius:6px;background:color-mix(in srgb,var(--c) calc(var(--a) * 100%),var(--card2));font:700 11px ui-monospace,monospace;color:var(--fg)}
.p15-day[aria-pressed=true]{outline:2px solid var(--acc)}
/* 16 Form guide */
.p16-strip{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 4px}
.p16-cell{width:auto}.p16-cell .res{width:34px;height:34px;font-size:15px;border-radius:8px}
.fr.m .p16-cell .res{width:28px;height:28px}
.p16-bars{display:grid;gap:10px;margin-top:12px}
.p16-bar{position:relative;height:26px;background:var(--card2);border-radius:999px;overflow:hidden}
.p16-bar i{position:absolute;inset:0 auto 0 0;width:var(--w);background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:999px}
.p16-bar b{position:absolute;right:10px;top:3px}
.p16-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.p16-big{font:900 34px/1 ui-monospace,monospace;text-align:center;color:var(--mut);margin:16px 0}
/* 17 Lockers */
.p17-room{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.fr.m .p17-room{grid-template-columns:1fr 1fr}
.p17-lk{background:linear-gradient(90deg,#475569,#334155 48%,#475569);color:#f1f5f9;border:2px solid #1e293b;border-radius:6px;min-height:130px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:left}
.p17-open{background:#0f172a;outline:2px solid var(--acc)}
.p17-shut{opacity:.6}
.p17-np{background:#e2e8f0;color:#0f172a;border-radius:3px;padding:2px 6px;font:700 11px system-ui;text-align:center}
.p17-tape{background:#fef9c3;color:#422006;padding:6px;font:12px/1.3 "Courier New",monospace;transform:rotate(-2deg);margin-top:auto}
.p17-shelf{margin-top:10px;background:var(--card);border-radius:8px;padding:10px}
.p17-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
/* 18 Scoreboard */
.p18-sb{background:#0a0a0a;border:6px solid #374151;border-radius:10px;padding:14px;text-align:center;color:#fbbf24;font-family:ui-monospace,"Courier New",monospace}
.p18-dm{letter-spacing:.2em;font-size:12px;color:#fde68a}
.p18-score{font:900 56px/1.1 ui-monospace,monospace;color:#f59e0b;text-shadow:0 0 12px rgba(245,158,11,.6)}
.p18-panel{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0;background:#111;border:2px solid #374151;padding:10px;border-radius:6px}
.p18-panel button{background:#1f2937;color:#fbbf24;border:0;border-radius:6px;padding:8px 10px}
.p18-panel>div{flex:1}
.p18-v{font:900 36px/1.1 ui-monospace,monospace;color:#fff}
.p18-form{display:flex;gap:3px;justify-content:center}
/* 19 Pitch map */
.p19-pitch{position:relative;aspect-ratio:68/80;background:repeating-linear-gradient(0deg,#1d5428 0 10%,#174a22 10% 20%);border:2px solid rgba(255,255,255,.35);border-radius:10px;margin-top:12px}
.fr.d .p19-pitch{aspect-ratio:105/52}
.p19-spot{position:absolute;transform:translate(-50%,-50%);width:120px;text-align:center}
.fr.m .p19-spot{width:84px}
.p19-disc{display:inline-grid;place-items:center;min-width:52px;height:52px;padding:0 6px;border-radius:999px;background:linear-gradient(160deg,#f2d98a,#b7892a);color:#241a05;font-weight:900;font-size:15px;border:2px solid rgba(0,0,0,.35)}
.fr.m .p19-disc{min-width:40px;height:40px;font-size:12px}
.p19-lab{display:block;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px #000}
.fr.m .p19-lab{font-size:9px}
.p19-msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;padding:20px;text-align:center}
.p19-pitch .det{display:none}
/* 20 Folder */
.p20-tabs{display:flex;gap:2px;flex-wrap:wrap}
.p20-tabs button{background:#d6b67a;color:#3b2a06;border:0;border-radius:8px 8px 0 0;padding:6px 12px;font-weight:700}
.p20-tabs button[aria-pressed=true]{background:#f2dca8}
.p20-sheet{background:#f2dca8;color:#2a1d05;border-radius:0 8px 8px 8px;padding:14px}
.p20-card{background:#fffbeb;border-radius:6px;padding:8px;color:#2a1d05}
.K20 .p20-sheet .mut{color:#5b4a2a}
.K20 .p20-sheet .emp{border-color:#b08d4c}
/* 21 Banners */
.p21-rafters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;border-top:6px solid #44403c;padding-top:0;margin-bottom:14px}
.p21-bn{width:118px;min-height:150px;background:#7f1d1d;color:#fef3c7;clip-path:polygon(0 0,100% 0,100% 86%,50% 100%,0 86%);padding:12px 8px 26px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;font-family:Georgia,serif}
.p21-bn:nth-child(3n+2){background:#1e3a8a}.p21-bn:nth-child(3n){background:#14532d}
.p21-bn b{font-size:14px;letter-spacing:.06em}.p21-t{font-size:11px}
.fr.m .p21-bn{width:96px;min-height:130px}
.p21-ghost{background:transparent!important;border:2px dashed var(--line);color:var(--mut);justify-content:center;font-size:12px}
.p21-recs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.fr.m .p21-recs{grid-template-columns:1fr 1fr}
.p21-rec{background:var(--card);border-radius:8px;padding:8px;font-size:13px}
.p21-rec b{font-size:18px}
/* 22 Tickets */
.p22-lid{background:#7c2d12;color:#ffedd5;border-radius:10px 10px 0 0;padding:10px 14px;font:700 13px ui-monospace,monospace;display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px}
.p22-lidr{width:auto}
.p22-box{background:#292524;border-radius:0 0 10px 10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;color:#e7e5e4}
.fr.m .p22-box{grid-template-columns:1fr}
.p22-tk{background:#fafaf9;color:#1c1917;border-radius:6px;padding:8px 10px;border-left:6px dashed #a8a29e;display:flex;flex-direction:column;gap:3px}
.p22-gold{background:linear-gradient(160deg,#fde68a,#d97706)}
.p22-d{font:700 10px ui-monospace,monospace;letter-spacing:.1em}.p22-m{font-size:11px;color:#57534e}
.p22-tk .det{color:#57534e}
/* 23 Panini */
.p23-pg{background:#f5f0e1;color:#1f2937;border-radius:10px;padding:14px}
.p23-hd{display:flex;gap:8px;align-items:center;margin-bottom:10px}.p23-hd .mut{margin-left:auto;color:#6b7280}
.p23-g{gap:10px}
.p23-slot{border:2px dashed #9ca3af;border-radius:8px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center}
.p23-stk{background:linear-gradient(160deg,#fff,#dbeafe 40%,#fef3c7);border:2px solid #1d4ed8;border-radius:8px;min-height:110px;padding:8px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.p23-no{display:block;font:800 10px ui-monospace,monospace;color:#6b7280}
.p23-v{display:block;font-size:26px;font-weight:900;color:#1e3a8a}.p23-k{display:block;font-size:11px;font-weight:700}
.p23-stk .det{color:#4b5563}
/* 24 Spreadsheet */
.p24-sum{background:var(--card2);border:1px solid var(--line);padding:6px 10px;font-size:12px;border-radius:6px;margin-bottom:8px}
.p24-recs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-bottom:10px}
.p24-rc{width:auto}
.p24-t{font-size:12px}.p24-t th{text-align:left;background:var(--card2);padding:4px 6px;border:1px solid var(--line)}
.p24-t td{padding:4px 6px;border:1px solid var(--line);cursor:pointer}
.p24-on td{background:color-mix(in srgb,var(--acc) 20%,transparent)}
/* 25 Milestones */
.p25-track{display:flex;gap:0;margin:16px 0;flex-wrap:wrap}
.p25-st{flex:1 1 0;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;text-align:center}
.p25-st::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.p25-st:first-child::before{display:none}
.p25-done::before{background:var(--up)}
.p25-dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:2px solid var(--line);font-weight:800;font-size:12px}
.p25-done .p25-dot{background:var(--up);color:#052e16;border-color:var(--up)}
.p25-next .p25-dot{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent)}
.p25-l{font-size:11px}
.fr.m .p25-l{font-size:9px}
.p25-c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
/* 26 Mixtape */
.p26-j{background:#fde047;color:#1c1917;border-radius:6px;padding:14px;font-family:"Courier New",ui-monospace,monospace;border:3px solid #1c1917}
.p26-t{font-weight:900;border-bottom:3px solid #1c1917;padding-bottom:6px;margin-bottom:8px}
.p26-sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fr.m .p26-sides{grid-template-columns:1fr}
.p26-sides h4{margin:0 0 6px}
.p26-tr{font-size:13px}
.p26-notes{margin-top:10px;font-size:12px;border-top:2px dashed #1c1917;padding-top:6px}
.p26-n{display:inline;width:auto}
.K26 .p26-j .mut,.K26 .p26-j .det{color:#44403c}
.K26 .tabs button{background:#fef9c3;color:#1c1917;border-color:#1c1917}
/* 27 Medals */
.p27-rack{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:16px 0;border-top:6px solid #78350f;padding-top:0}
.fr.m .p27-rack{grid-template-columns:repeat(4,1fr)}
.p27-m{display:flex;flex-direction:column;align-items:center;text-align:center}
.p27-rib{width:26px;height:40px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.p27-disc{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fef08a,#ca8a04 60%,#854d0e);color:#422006;font-weight:900;margin-top:-6px;box-shadow:0 3px 6px rgba(0,0,0,.4);font-size:14px}
.fr.m .p27-disc{width:48px;height:48px;font-size:12px}
.p27-off{background:radial-gradient(circle at 35% 30%,#d6d3d1,#78716c 60%,#44403c);color:#1c1917}
.p27-l{font-size:11px;margin-top:4px}
/* 28 VHS */
.p28-shelf{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;border-bottom:8px solid #57534e;padding-bottom:8px}
.p28-tape{width:150px;background:#1c1917;color:#fff;border:0;border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.fr.m .p28-tape{width:calc(50% - 4px)}
.p28-tape[aria-pressed=true]{outline:2px solid var(--acc)}
.p28-lbl{background:#fafaf9;color:#1c1917;font:700 11px/1.2 "Comic Sans MS","Marker Felt",cursive;padding:4px;border-radius:2px}
.p28-blank{color:var(--mut);background:var(--card2)}
.p28-hl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.fr.m .p28-hl{grid-template-columns:1fr 1fr}
.p28-h{background:var(--card);border-radius:6px;padding:8px;font-size:12px}
.p28-h b{display:block;font-size:18px}
/* 29 Chalkboard */
.p29-cb{background:#1f3a2b;color:#f1f5f9;border:10px solid #7c4a1e;border-radius:8px;padding:16px;font-family:"Comic Sans MS","Segoe Print","Marker Felt",cursive}
.p29-h{font-size:22px;text-decoration:underline;margin-bottom:8px}
.p29-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fr.m .p29-cols{grid-template-columns:1fr}
.p29-ch{display:block;margin:3px 0;font-size:14px}
.p29-box{border:2px solid #f1f5f9;border-radius:6px;padding:8px;margin-top:8px;display:inline-block}
.p29-cb .det{color:#cbd5e1}
.K29 .tabs button{background:transparent;color:#f1f5f9;border-color:#f1f5f9}
/* 30 Pocket diary */
.p30-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.p30-three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.p30-n{background:var(--card2);border-radius:10px;padding:8px;text-align:center}
.p30-n b{display:block;font-size:22px}.p30-n span{font-size:11px}
.p30-d{border-bottom:1px solid var(--line);padding:10px 2px}
.p30-d summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;flex-wrap:wrap}
.p30-m{padding:5px 0}
.p30-r{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}

</style>
</head>

function rng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const MODE = Object.fromEntries(DATA.modes.map((m) => [m.id, m]));
const CTX = { season: ["Legacy · Arsenal", "Chemistry Draft"], classic: ["Classic · Arsenal 1998/99", "Survival · Southampton 2004/05"], ladder: ["Weekly Ladder"], market: ["Mystery Market"], daily: ["Daily challenge"], whatif: ["What-If · rescue"], single: ["Tactical H2H", "Budget Cap", "Chaos Draft", "Nationality · Egypt"] };
const FULL_LOG = (() => {
  const r = rng(1812), out = [], order = ["season", "season", "classic", "ladder", "single", "daily", "season", "market", "whatif", "ladder", "single", "daily"];
  const start = Date.UTC(2026, 9, 1);
  for (let k = 0; k < 46; k++) {
    const mode = order[k % order.length];
    const club = DATA.clubs[Math.floor(r() * DATA.clubs.length)];
    let gf = Math.floor(r() * 4), ga = Math.floor(r() * 3);
    if (k === 17) { gf = 6; ga = 0; }
    if (k === 30) { gf = 0; ga = 4; }
    const day = new Date(start + Math.floor((k / 46) * 22) * 864e5).toISOString().slice(0, 10);
    const ctx = CTX[mode][Math.floor(r() * CTX[mode].length)];
    const step = mode === "season" || mode === "classic" ? ` · MW ${1 + Math.floor(r() * 38)}` : mode === "ladder" ? ` · Day ${1 + (k % 7)}` : mode === "market" ? ` · Round ${1 + (k % 9)}` : "";
    out.push({ id: k, mode, day, opp: club, gf, ga, res: gf > ga ? "W" : gf === ga ? "D" : "L", ctx: ctx + step });
  }
  // Longest unbeaten: a deliberate 11-match run.
  for (let k = 19; k < 30; k++) { const e = out[k]; if (e.res === "L") { e.gf = e.ga + 1; e.res = "W"; } }
  return out;
})();
const SPARSE_LOG = [
  { id: 900, mode: "single", day: "2026-10-23", opp: DATA.clubs[1], gf: 2, ga: 1, res: "W", ctx: "Tactical H2H" },
  { id: 901, mode: "daily", day: "2026-10-23", opp: DATA.clubs[4], gf: 1, ga: 1, res: "D", ctx: "Daily challenge" },
  { id: 902, mode: "whatif", day: "2026-10-23", opp: DATA.clubs[3], gf: 3, ga: 3, res: "D", ctx: "What-If · Southampton 3–3 Liverpool" },
];

/* ───────── the derivation the page will run on the stores ───────── */
function view() {
  const st = G.state;
  const log = st === "full" ? FULL_LOG : st === "sparse" ? SPARSE_LOG : [];
  const runs = st === "full" ? DATA.runs : [];
  const daily = st === "full" ? DATA.daily : st === "sparse" ? { played: 1, won: 0, current: 1, best: 1 } : { played: 0, won: 0, current: 0, best: 0 };
  const whatif = st === "full" ? DATA.whatif : st === "sparse" ? { played: 1, rewritten: 0 } : { played: 0, rewritten: 0 };
  const chron = [...log].sort((a, b) => a.id - b.id);
  const recent = [...chron].reverse();
  const t = { p: log.length, w: 0, d: 0, l: 0, gf: 0, ga: 0 };
  for (const e of log) { t[e.res.toLowerCase()]++; t.gf += e.gf; t.ga += e.ga; }
  t.pct = t.p ? Math.round((t.w / t.p) * 100) : 0;
  const big = log.filter((e) => e.gf > e.ga).sort((a, b) => b.gf - b.ga - (a.gf - a.ga) || b.gf - a.gf)[0] || null;
  let run = 0, best = 0, bestEnd = null;
  for (const e of chron) { if (e.res === "L") run = 0; else { run++; if (run > best) { best = run; bestEnd = e; } } }
  const seasons = runs.filter((r) => (r.mode === "season" || r.mode === "classic") && !r.survived);
  const bestSeason = [...seasons].sort((a, b) => a.pos - b.pos || b.pts - a.pts)[0] || null;
  const survival = runs.find((r) => r.survived) || null;
  const weeks = runs.filter((r) => r.mode === "ladder");
  let ts = 0, tsBest = 0; for (const w of weeks) { ts = w.pos === 1 ? ts + 1 : 0; tsBest = Math.max(tsBest, ts); }
  const ladder = { weeks: weeks.length, titles: weeks.filter((w) => w.pos === 1).length, bestFinish: weeks.length ? Math.min(...weeks.map((w) => w.pos)) : null, bestPts: weeks.length ? Math.max(...weeks.map((w) => w.pts)) : null, streak: tsBest };
  const mk = runs.filter((r) => r.mode === "market").sort((a, b) => b.wins - a.wins || a.rounds - b.rounds)[0] || null;
  const modes = DATA.modes.map((m) => {
    const es = log.filter((e) => e.mode === m.id);
    const o = { ...m, p: es.length, w: 0, d: 0, l: 0 };
    for (const e of es) o[e.res.toLowerCase()]++;
    o.best = m.id === "season" && bestSeason ? `${ord(bestSeason.pos)} · ${bestSeason.pts} pts` : m.id === "classic" && survival ? `Survived · ${survival.title.split("· ")[1]}` : m.id === "ladder" && ladder.titles ? `${ladder.titles} titles` : m.id === "market" && mk ? `${mk.wins} wins` : m.id === "daily" && daily.best ? `best streak ${daily.best}` : m.id === "whatif" && whatif.rewritten ? `${whatif.rewritten} rescues` : "—";
    return o;
  });
  const line = (e) => `${e.ctx} · ${fmtDay(e.day)} · Your XI ${e.gf}–${e.ga} ${e.opp.name}`;
  const recs = [
    { k: "pct", label: "Win rate", value: t.p ? `${t.pct}%` : "—", sub: t.p ? `${t.w}W ${t.d}D ${t.l}L` : "No matches yet", line: t.p ? `${t.p} matches played since ${fmtDay(chron[0].day)}` : "" },
    { k: "big", label: "Biggest win", value: big ? `${big.gf}–${big.ga}` : "—", sub: big ? `v ${big.opp.name}` : "Win a match", line: big ? line(big) : "", club: big?.opp },
    { k: "unb", label: "Longest unbeaten", value: best ? String(best) : "—", sub: best ? "matches" : "—", line: bestEnd ? `Ended ${fmtDay(bestEnd.day)} · ${bestEnd.ctx}` : "" },
    { k: "season", label: "Best season", value: bestSeason ? ord(bestSeason.pos) : "—", sub: bestSeason ? `${bestSeason.pts} pts · ${bestSeason.title}` : "Finish a season", line: bestSeason ? `${bestSeason.title} · ${bestSeason.w}W ${bestSeason.d}D ${bestSeason.l}L · ${bestSeason.pts} pts` : "" },
    { k: "ladder", label: "Ladder titles", value: ladder.weeks ? String(ladder.titles) : "—", sub: ladder.weeks ? `best ${ord(ladder.bestFinish)} · streak ${ladder.streak}` : "Play a week", line: ladder.weeks ? `${ladder.weeks} weeks · best ${ladder.bestPts} pts in a week` : "" },
    { k: "market", label: "Market best run", value: mk ? `${mk.wins}` : "—", sub: mk ? `wins in ${mk.rounds} rounds` : "Start a run", line: mk ? `${mk.title} · ${fmtDay(mk.day)}` : "" },
    { k: "daily", label: "Daily streak", value: daily.played ? `${daily.current}` : "—", sub: daily.played ? `best ${daily.best} · ${daily.won}/${daily.played} won` : "Play today's", line: daily.played ? `${daily.played} daily challenges played` : "" },
    { k: "whatif", label: "History rewritten", value: whatif.played ? `${whatif.rewritten}` : "—", sub: whatif.played ? `of ${whatif.played} rescues` : "Try a What-If", line: whatif.played ? `${whatif.rewritten} famous results turned around` : "" },
  ];
  const f = R.filter;
  const list = recent.filter((e) => f === "all" || e.mode === f);
  return { empty: log.length === 0 && runs.length === 0, st, log, chron, recent, list, runs, t, big, best, bestSeason, survival, ladder, mk, daily, whatif, modes, recs, form: recent.slice(0, 10), line };
}
const ord = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const fmtDay = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short" });

/* ───────── shared bits every concept composes ───────── */
const CRESTS_COACH = { lion: { emoji: "🦁", color: "#c2410c" } };
const coach = (size = 40) => { const c = CRESTS_COACH[DATA.coach.crest]; return `<span class="badge" style="width:${size}px;height:${size}px;background:${c.color};font-size:${Math.round(size * 0.55)}px" aria-label="Lion">${c.emoji}</span>`; };
const crest = (club, size = 20) => (club && CRESTS[club.id] ? `<img class="cr" src="${CRESTS[club.id]}" width="${size}" height="${size}" alt="">` : "");
const res = (r) => `<span class="res ${r}" aria-label="${{ W: "Win", D: "Draw", L: "Loss" }[r]}">${r}</span>`;
const form = (V, n = 10) => V.form.slice(0, n).map((e) => res(e.res)).join("");
function tabs(V) {
  const used = new Set(V.log.map((e) => e.mode));
  const opts = [["all", "All"], ...DATA.modes.filter((m) => used.has(m.id)).map((m) => [m.id, `${m.emoji} ${m.label}`])];
  return `<div class="tabs" role="group" aria-label="Filter by mode">${opts.map(([v, l]) => `<button data-act="f" data-v="${v}" aria-pressed="${R.filter === v}">${esc(l)}</button>`).join("")}</div>`;
}
/** A tappable match: its one-line detail opens under it. */
const sel = (id) => R.sel === id;
const det = (txt, id) => (sel(id) && txt ? `<span class="det">${esc(txt)}</span>` : "");
const recDet = (r) => det(r.line, "r:" + r.k);
function empty(V, title = "No records yet", body = "Play a match — every full-time result from now on is kept here, and your seasons, ladder weeks and Market runs become records.") {
  return `<div class="emp"><b>${esc(title)}</b><span class="mut">${esc(body)}</span><br><button class="cta">Play a match</button></div>`;
}
const sparseNote = (V) => (V.st === "sparse" ? `<p class="mut" style="font-size:12px;margin:8px 0 0">Your first records — they fill in as you finish seasons, ladder weeks and Market runs.</p>` : "");
const head = (V, m) => `<div class="row" style="gap:12px">${coach(m ? 40 : 52)}<div style="min-width:0"><div style="font-weight:800;font-size:${m ? 18 : 22}px">Coach ${esc(DATA.coach.name)}</div><div class="mut" style="font-size:12px">${V.t.p} matches · since ${V.chron[0] ? fmtDay(V.chron[0].day) : "today"}</div></div></div>`;

const hitRec = (r, inner, cls = "") => `<button class="hit ${cls}" data-act="s" data-v="r:${r.k}" aria-expanded="${sel("r:" + r.k)}">${inner}${recDet(r)}</button>`;
const hitMatch = (V, e, inner, cls = "") => `<button class="hit ${cls}" data-act="s" data-v="m:${e.id}" aria-expanded="${sel("m:" + e.id)}">${inner}${det(V.line(e), "m:" + e.id)}</button>`;

const logList = (V, m, n = 8, cls = "") => (V.list.length ? V.list.slice(0, m ? Math.min(n, 6) : n).map((e) => hitMatch(V, e, `<span class="row" style="flex-wrap:nowrap">${matchLine(e)}<span class="mut clip" style="margin-left:auto;font-size:12px">${esc(MODE[e.mode].emoji)} ${fmtDay(e.day)}</span></span>`, cls)).join("") : `<p class="mut">No matches in this mode yet.</p>`);
const modeRows = (V) => V.modes.filter((x) => x.p || x.best !== "—");

  const rows = modeRows(V).sort((a, b) => b.w / (b.p || 1) - a.w / (a.p || 1));
  return `${head(V, m)}<div class="p10-strip">${V.recs.slice(0, m ? 4 : 8).map((r) => hitRec(r, `<span class="mut" style="font-size:11px">${r.label}</span><b class="num">${r.value}</b>`, "p10-chip")).join("")}</div>
  <table class="p10-t num"><tr><th>#</th><th>Mode</th><th>P</th><th>W</th><th>D</th><th>L</th><th>%</th>${m ? "" : "<th>Best</th>"}</tr>${rows.map((x, i) => `<tr><td>${i + 1}</td><td>${x.emoji} ${m ? "" : esc(x.label)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.p ? Math.round((x.w / x.p) * 100) : "–"}</td>${m ? "" : `<td>${esc(x.best)}</td>`}</tr>`).join("")}</table>${sparseNote(V)}<div style="margin-top:12px">${tabs(V)}${logList(V, m, 6)}</div>`;
} });
/* 11 */
C.push({ name: "Career Stock Ticker", idea: "The Stock Ticker valuation, applied to the career: a big 'win rate' price with a change badge, a bar per match (tap one), and gainers/losers become best and worst modes.", render(V, m) {
  if (V.empty) return `<div class="p11-term"><div class="p11-sym">PIQ:CAREER</div><div class="p11-px">—</div><p class="mut">No trading yet — the market opens with your first full time.</p><button class="cta">Play a match</button></div>`;
  const ms = V.chron.slice(-(m ? 20 : 40));
  const ranked = modeRows(V).filter((x) => x.p).sort((a, b) => b.w / b.p - a.w / a.p);
  return `<div class="p11-term"><div class="p11-sym">PIQ:CAREER · ${V.t.p} matches</div><div class="row"><span class="p11-px num">${V.t.pct}%</span><span class="p11-ch">${V.t.w}W ${V.t.d}D ${V.t.l}L</span></div>
  <div class="p11-bars">${ms.map((e) => `<button class="p11-bar ${e.res}" data-act="s" data-v="m:${e.id}" style="--h:${20 + (e.gf - e.ga + 4) * 10}%" aria-label="${esc(V.line(e))}"></button>`).join("")}</div>${(() => { const e = ms.find((x) => sel("m:" + x.id)); return e ? `<div class="det">${esc(V.line(e))}</div>` : `<div class="mut" style="font-size:11px">Tap a bar for the match</div>`; })()}
  <div class="p11-mv"><div><h4>Best modes</h4>${ranked.slice(0, 3).map((x) => `<div class="row"><span>${x.emoji}</span><span class="clip">${esc(x.label)}</span><b class="num" style="margin-left:auto;color:var(--up)">${Math.round((x.w / x.p) * 100)}%</b></div>`).join("")}</div><div><h4>Records</h4>${V.recs.slice(1, 5).map((r) => hitRec(r, `<span class="row"><span class="clip">${r.label}</span><b class="num" style="margin-left:auto">${r.value}</b></span>`)).join("")}</div></div>${sparseNote(V)}</div>`;
} });
/* 12 */
C.push({ name: "Teletext P302", idea: "Ceefax-style page 302 RECORDS: block colours, fixed-width rows, fastext buttons along the bottom act as the mode filter.", render(V, m) {
  const top = `<div class="p12-hd"><span>P302</span><span>PITCHIQ</span><span>RECORDS</span></div>`;
  if (V.empty) return `<div class="p12-tt">${top}<div class="p12-y">NO RECORDS ON THIS PAGE</div><div class="p12-c">PLAY A MATCH TO START YOUR CAREER</div></div>`;
  const used = new Set(V.log.map((e) => e.mode));
  const fx = [["all", "ALL", "r"], ...DATA.modes.filter((x) => used.has(x.id)).slice(0, 3).map((x, i) => [x.id, x.label.split(" ")[0].toUpperCase(), ["g", "y", "c"][i]])];
  return `<div class="p12-tt">${top}<div class="p12-y">COACH ${esc(DATA.coach.name).toUpperCase()} - CAREER</div>${V.recs.map((r) => hitRec(r, `<span class="p12-row"><span class="clip">${r.label.toUpperCase()}</span><span class="p12-c num">${r.value}</span></span>`)).join("")}<div class="p12-y" style="margin-top:6px">LATEST RESULTS</div>${V.list.slice(0, m ? 5 : 8).map((e) => hitMatch(V, e, `<span class="p12-row"><span class="clip">${esc(e.opp.name.toUpperCase())}</span><span class="num">${e.gf}-${e.ga} ${e.res}</span></span>`)).join("")}<div class="p12-fx">${fx.map(([v, l, c]) => `<button data-act="f" data-v="${v}" class="p12-${c}" aria-pressed="${R.filter === v}">${l}</button>`).join("")}</div></div>`;
} });
/* 13 */
C.push({ name: "Scouting Report", idea: "A clipboard dossier written about YOU: strengths (best records), weaknesses (worst mode, heaviest defeat), a typed form line — the Scout's Dossier turned on the coach.", render(V, m) {
  const clip = (x) => `<div class="p13-clip"><div class="p13-cl"></div><div class="p13-paper"><div class="p13-t">SCOUTING REPORT — COACH ${esc(DATA.coach.name).toUpperCase()}</div>${x}</div></div>`;
  if (V.empty) return clip(`<p>Subject has no recorded matches. Recommend: watch him play one.</p><button class="cta">Play a match</button>`);
  const worst = modeRows(V).filter((x) => x.p).sort((a, b) => a.w / a.p - b.w / b.p)[0];
  const heavy = V.log.filter((e) => e.ga > e.gf).sort((a, b) => b.ga - b.gf - (a.ga - a.gf))[0];
  return clip(`<h4>Strengths</h4>${V.recs.filter((r) => r.value !== "—").slice(0, 4).map((r) => hitRec(r, `✔ ${r.label}: <b>${r.value}</b> <span class="mut">${esc(r.sub)}</span>`, "p13-li")).join("")}
  <h4>Concerns</h4>${worst ? `<div class="p13-li">✘ Weakest in ${esc(worst.label)} (${worst.w}W ${worst.d}D ${worst.l}L)</div>` : ""}${heavy ? hitMatch(V, heavy, `✘ Heaviest defeat ${heavy.gf}–${heavy.ga} v ${esc(heavy.opp.name)}`, "p13-li") : ""}
  <h4>Recent form</h4><div class="row">${form(V)}</div>${sparseNote(V)}<h4>Match notes</h4>${tabs(V)}${logList(V, m, 5)}`);
} });
/* 14 */
C.push({ name: "Passport Stamps", idea: "A passport whose pages are the modes: every finished run is an ink stamp (rotated, dated); records sit on the photo page beside the coach crest.", render(V, m) {
  const photo = `<div class="p14-photo">${coach(m ? 48 : 64)}<div><div class="p14-lab">COACH</div><b>${esc(DATA.coach.name)}</b><div class="p14-lab" style="margin-top:6px">ISSUED</div>${V.chron[0] ? fmtDay(V.chron[0].day) : "—"}</div></div>`;
  if (V.empty) return `<div class="p14-pp">${photo}<div class="p14-page"><span class="mut">No stamps yet — every finished season, ladder week and Market run stamps a page.</span><br><button class="cta">Play a match</button></div></div>`;
  return `<div class="p14-pp">${photo}<div class="p14-recs">${V.recs.map((r) => hitRec(r, `<span class="p14-lab">${r.label}</span><b class="num">${r.value}</b>`, "p14-rec")).join("")}</div><div class="p14-page">${V.runs.map((r, i) => `<span class="p14-stamp" style="--r:${(i % 2 ? 1 : -1) * (4 + (i % 3) * 3)}deg"><b>${esc(MODE[r.mode].emoji)} ${r.pos ? ord(r.pos) : r.wins + "W"}</b><span>${esc(r.title)}</span><span>${fmtDay(r.day)}</span></span>`).join("") || `<span class="mut">Your first stamp comes when you finish a run.</span>`}</div></div>${sparseNote(V)}<div style="margin-top:12px">${tabs(V)}${logList(V, m, 5)}</div>`;
} });
/* 15 */
C.push({ name: "Heat Calendar", idea: "The daily hub's 28-day heat calendar, career-wide: one square per day shaded by matches played and coloured by results; tap a day for its matches. Records ride a rail above.", render(V, m) {
  if (V.empty) return head(V, m) + `<div style="height:12px"></div>` + empty(V);
  const days = []; for (let k = 0; k < 28; k++) days.push(new Date(Date.UTC(2026, 8, 26) + k * 864e5).toISOString().slice(0, 10));
  const by = (d) => V.log.filter((e) => e.day === d);
  return `${head(V, m)}<div class="p15-rail">${V.recs.slice(0, m ? 4 : 8).map((r) => hitRec(r, `<b class="num">${r.value}</b><span class="mut">${r.label}</span>`, "p15-chip")).join("")}</div>
  <div class="p15-cal">${days.map((d) => { const es = by(d); const w = es.filter((e) => e.res === "W").length; return `<button class="p15-day" data-act="s" data-v="d:${d}" style="--a:${Math.min(1, es.length / 3)};--c:${es.length ? (w * 2 >= es.length ? "var(--up)" : "var(--down)") : "var(--line)"}" aria-label="${d}: ${es.length} matches" aria-pressed="${sel("d:" + d)}"><span>${+d.slice(8)}</span></button>`; }).join("")}</div>
  ${(() => { const d = days.find((x) => sel("d:" + x)); if (!d) return `<p class="mut" style="font-size:12px">Tap a day.</p>`; const es = by(d); return es.length ? es.map((e) => `<div class="row" style="flex-wrap:nowrap;margin:4px 0">${matchLine(e)}<span class="mut" style="margin-left:auto;font-size:12px">${esc(e.ctx)}</span></div>`).join("") : `<p class="mut">No matches on ${fmtDay(d)}.</p>`; })()}${sparseNote(V)}`;
} });
/* 16 */
C.push({ name: "Form Guide", idea: "Built around form: a huge W/D/L strip of the last 20, the unbeaten record drawn as a bar against the current run, streak boxes for daily and ladder titles.", render(V, m) {
  if (V.empty) return `<div class="p16-big">— — — — —</div>` + empty(V, "No form yet");
  let cur = 0; for (const e of V.recent) { if (e.res === "L") break; cur++; }
  return `${head(V, m)}<div class="p16-strip">${V.recent.slice(0, m ? 10 : 20).map((e) => hitMatch(V, e, res(e.res), "p16-cell")).join("")}</div>${(() => { const e = V.recent.find((x) => sel("m:" + x.id)); return e ? `<div class="det">${esc(V.line(e))}</div>` : ""; })()}
  <div class="p16-bars"><div><span class="mut">Current unbeaten run</span><div class="p16-bar"><i style="--w:${(cur / Math.max(1, V.best)) * 100}%"></i><b class="num">${cur}</b></div></div><div><span class="mut">Record unbeaten run</span><div class="p16-bar"><i style="--w:100%"></i><b class="num">${V.best}</b></div></div></div>
  <div class="grid" style="margin-top:12px">${V.recs.slice(3).map((r) => hitRec(r, `<b class="num" style="font-size:22px">${r.value}</b><div class="mut" style="font-size:12px">${r.label}</div>`, "p16-box")).join("")}</div>${sparseNote(V)}`;
} });
/* 17 */
C.push({ name: "Locker Room Plates", idea: "A row of lockers, one per mode, each with its nameplate and a taped-on record card; open a locker (tap) to see that mode's matches.", render(V, m) {
  if (V.empty) return `<div class="p17-room">${DATA.modes.slice(0, m ? 4 : 7).map((x) => `<div class="p17-lk p17-shut"><span class="p17-np">${x.emoji} ${esc(x.label)}</span><span class="p17-tape">empty</span></div>`).join("")}</div>` + empty(V, "Every locker is empty");
  const rows = modeRows(V);
  return `${head(V, m)}<div class="p17-room">${rows.map((x) => `<button class="p17-lk ${R.filter === x.id ? "p17-open" : ""}" data-act="f" data-v="${R.filter === x.id ? "all" : x.id}"><span class="p17-np">${x.emoji} ${esc(x.label)}</span><span class="p17-tape"><b class="num">${x.p ? `${x.w}-${x.d}-${x.l}` : "—"}</b><br>${esc(x.best)}</span></button>`).join("")}</div>
  <div class="p17-shelf">${R.filter === "all" ? `<span class="mut">Open a locker for its matches.</span>` : logList(V, m, 6)}</div><div class="grid" style="margin-top:12px">${V.recs.map((r) => hitRec(r, `<span class="mut" style="font-size:11px">${r.label}</span><b class="num" style="display:block;font-size:20px">${r.value}</b>`, "p17-card")).join("")}</div>${sparseNote(V)}`;
} });
/* 18 */
C.push({ name: "Stadium Scoreboard", idea: "The big end-of-ground scoreboard: dot-matrix panels, HOME = you, a career 'score' of W–L, then rotating panels you step through with ◀ ▶ for each record.", render(V, m) {
  if (V.empty) return `<div class="p18-sb"><div class="p18-dm">PITCHIQ STADIUM</div><div class="p18-score num">0 – 0</div><div class="p18-dm">KICK-OFF WHEN YOU ARE READY</div></div><div style="text-align:center"><button class="cta">Play a match</button></div>`;
  const k = Math.max(0, V.recs.findIndex((r) => sel("r:" + r.k)));
  const r = V.recs[k], nx = V.recs[(k + 1) % V.recs.length], pv = V.recs[(k + V.recs.length - 1) % V.recs.length];
  return `<div class="p18-sb"><div class="p18-dm">COACH ${esc(DATA.coach.name).toUpperCase()} · CAREER</div><div class="p18-score num">${V.t.w} – ${V.t.l}</div><div class="p18-dm">WON · LOST · ${V.t.d} DRAWN</div>
  <div class="p18-panel"><button data-act="s" data-v="r:${pv.k}" aria-label="Previous record">◀</button><div><div class="p18-dm">${r.label.toUpperCase()}</div><div class="p18-v num">${r.value}</div><div class="p18-dm" style="font-size:11px">${esc(r.sub).toUpperCase()}</div></div><button data-act="s" data-v="r:${nx.k}" aria-label="Next record">▶</button></div><div class="p18-form">${form(V)}</div></div>${sparseNote(V)}<div style="margin-top:12px">${tabs(V)}${logList(V, m, 5)}</div>`;
} });
/* 19 */
C.push({ name: "Pitch Map", idea: "Records laid out on a pitch like a formation: the headline record up front, defensive records (unbeaten, survival) at the back — read the career like a team sheet.", render(V, m) {
  const spots = [[50, 14], [24, 34], [76, 34], [50, 46], [16, 66], [40, 70], [60, 70], [84, 66]];
  if (V.empty) return `<div class="p19-pitch"><div class="p19-msg">An empty team sheet. Your first match picks the side.</div></div><div style="text-align:center"><button class="cta">Play a match</button></div>`;
  const order = ["big", "pct", "daily", "season", "unb", "ladder", "market", "whatif"];
  return `${head(V, m)}<div class="p19-pitch" dir="ltr">${order.map((k, i) => { const r = V.recs.find((x) => x.k === k); return `<span class="p19-spot" style="left:${spots[i][0]}%;top:${spots[i][1]}%">${hitRec(r, `<span class="p19-disc num">${r.value}</span><span class="p19-lab">${r.label}</span>`)}</span>`; }).join("")}</div>${(() => { const r = V.recs.find((x) => sel("r:" + x.k)); return r && r.line ? `<div class="det">${esc(r.line)}</div>` : ""; })()}${sparseNote(V)}<div style="margin-top:12px">${tabs(V)}${logList(V, m, 5)}</div>`;
} });
/* 20 */
C.push({ name: "Dossier Folder Tabs", idea: "A manila folder with index tabs — Overview, then one tab per mode. Each tab's sheet has that mode's records and matches; Overview holds the career totals.", render(V, m) {
  const used = DATA.modes.filter((x) => V.log.some((e) => e.mode === x.id));
  const tb = `<div class="p20-tabs">${[["all", "Overview"], ...used.map((x) => [x.id, m ? x.emoji : `${x.emoji} ${x.label}`])].map(([v, l]) => `<button data-act="f" data-v="${v}" aria-pressed="${R.filter === v}">${esc(l)}</button>`).join("")}</div>`;
  if (V.empty) return `<div class="p20-f"><div class="p20-tabs"><button aria-pressed="true">Overview</button></div><div class="p20-sheet">${empty(V, "An empty file")}</div></div>`;
  const md = V.modes.find((x) => x.id === R.filter);
  return `<div class="p20-f">${tb}<div class="p20-sheet">${R.filter === "all" ? `${head(V, m)}<div class="grid" style="margin-top:12px">${V.recs.map((r) => hitRec(r, `<span class="mut" style="font-size:11px">${r.label}</span><b class="num" style="display:block;font-size:20px">${r.value}</b><span class="mut" style="font-size:11px">${esc(r.sub)}</span>`, "p20-card")).join("")}</div>` : `<h3 style="margin:0 0 6px">${md.emoji} ${esc(md.label)}</h3><p class="num"><b>${md.w}W ${md.d}D ${md.l}L</b> · best: ${esc(md.best)}</p>${logList(V, m, 8)}`}${sparseNote(V)}</div></div>`;
} });
/* 21 */
C.push({ name: "Hall Banners", idea: "Championship banners hanging from the rafters: one per finished run that won something (titles, survival, best Market run); the records are a banner row of their own.", render(V, m) {
  const won = V.runs.filter((r) => r.pos === 1 || r.survived || (r.mode === "market" && r === V.mk));
  if (V.empty) return `<div class="p21-rafters"><div class="p21-bn p21-ghost">YOUR FIRST BANNER</div></div>` + empty(V, "The rafters are bare");
  return `<div class="p21-rafters">${won.map((r) => `<div class="p21-bn"><span>${esc(MODE[r.mode].emoji)}</span><b>${r.pos === 1 ? "CHAMPIONS" : r.survived ? "SURVIVED" : `${r.wins} WINS`}</b><span class="p21-t">${esc(r.title)}</span></div>`).join("") || `<div class="p21-bn p21-ghost">YOUR FIRST BANNER</div>`}</div>
  ${head(V, m)}<div class="p21-recs">${V.recs.map((r) => hitRec(r, `<b class="num">${r.value}</b> <span class="mut">${r.label}</span>`, "p21-rec")).join("")}</div>${sparseNote(V)}<div style="margin-top:12px">${tabs(V)}${logList(V, m, 5)}</div>`;
} });
/* 22 */
C.push({ name: "Ticket Stubs", idea: "Every match is a torn ticket stub in a shoebox — date, fixture, score stamped on; record-setting matches have a gold stub. Records are printed on the box lid.", render(V, m) {
  if (V.empty) return `<div class="p22-lid">MATCH TICKETS</div><div class="p22-box"><span class="mut">The box is empty. Keep your first ticket.</span><br><button class="cta">Play a match</button></div>`;
  return `<div class="p22-lid">${V.recs.slice(0, m ? 3 : 6).map((r) => hitRec(r, `${r.label}: <b class="num">${r.value}</b>`, "p22-lidr")).join("")}</div>${tabs(V)}<div class="p22-box">${V.list.slice(0, m ? 6 : 12).map((e) => hitMatch(V, e, `<span class="p22-d">${fmtDay(e.day)}</span><span class="p22-m">${MODE[e.mode].emoji} ${esc(e.ctx.split(" · ")[0])}</span><span class="row" style="flex-wrap:nowrap">${matchLine(e)}</span>`, `p22-tk ${V.big && e.id === V.big.id ? "p22-gold" : ""}`)).join("")}</div>${sparseNote(V)}`;
} });
/* 23 */
C.push({ name: "Panini Record Pages", idea: "Album pages beside the Sticker Album: each record is a numbered sticker slot — filled with a shiny sticker once set, an empty outline with its number until then.", render(V, m) {
  return `<div class="p23-pg"><div class="p23-hd">${coach(30)}<b>RECORDS · PAGE 1</b><span class="mut">${V.recs.filter((r) => r.value !== "—").length}/${V.recs.length}</span></div><div class="grid p23-g">${V.recs.map((r, i) => r.value === "—" ? `<div class="p23-slot"><span class="p23-no">${i + 1}</span><span class="mut" style="font-size:11px">${r.label}</span></div>` : hitRec(r, `<span class="p23-no">${i + 1}</span><span class="p23-v num">${r.value}</span><span class="p23-k">${r.label}</span>`, "p23-stk")).join("")}</div></div>${V.empty ? `<div style="text-align:center;margin-top:10px"><span class="mut">Every slot is empty — play a match for your first sticker.</span><br><button class="cta">Play a match</button></div>` : sparseNote(V) + `<div style="margin-top:12px">${tabs(V)}${logList(V, m, 5)}</div>`}`;
} });
/* 24 */
C.push({ name: "Analyst Spreadsheet", idea: "The data person's view: a dense, column-headed match table with mode, date, opponent, score, result, goal difference — records as a frozen summary row on top.", render(V, m) {
  if (V.empty) return `<div class="p24-sum num">P 0 · W 0 · D 0 · L 0 · GF 0 · GA 0</div>` + empty(V, "0 rows");
  return `<div class="p24-sum num">P ${V.t.p} · W ${V.t.w} · D ${V.t.d} · L ${V.t.l} · GF ${V.t.gf} · GA ${V.t.ga} · ${V.t.pct}%</div><div class="p24-recs">${V.recs.map((r) => hitRec(r, `<span class="mut">${r.label}</span> <b class="num">${r.value}</b>`, "p24-rc")).join("")}</div>${tabs(V)}
  <table class="p24-t num"><tr><th>Date</th>${m ? "" : "<th>Mode</th>"}<th>Opponent</th><th>Score</th><th>R</th>${m ? "" : "<th>GD</th>"}</tr>${V.list.slice(0, m ? 10 : 16).map((e) => `<tr data-act="s" data-v="m:${e.id}" class="${sel("m:" + e.id) ? "p24-on" : ""}"><td>${fmtDay(e.day)}</td>${m ? "" : `<td>${esc(e.ctx)}</td>`}<td class="clip" style="max-width:${m ? 120 : 220}px">${esc(e.opp.name)}</td><td>${e.gf}–${e.ga}</td><td>${res(e.res)}</td>${m ? "" : `<td>${e.gf - e.ga > 0 ? "+" : ""}${e.gf - e.ga}</td>`}</tr>`).join("")}</table>${(() => { const e = V.list.find((x) => sel("m:" + x.id)); return e ? `<div class="det">${esc(V.line(e))}</div>` : ""; })()}${sparseNote(V)}`;
} });
/* 25 */
C.push({ name: "Milestone Track", idea: "A progress track of career milestones — 1st win, 10 matches, first title, 50 matches, 100 matches — ticked off with the day reached, the next one glowing; records below.", render(V, m) {
  const ms = [["First match", V.t.p >= 1], ["First win", V.t.w >= 1], ["10 matches", V.t.p >= 10], ["First title", V.ladder.titles + (V.bestSeason?.pos === 1 ? 1 : 0) > 0], ["25 wins", V.t.w >= 25], ["50 matches", V.t.p >= 50], ["100 matches", V.t.p >= 100]];
  const next = ms.findIndex((x) => !x[1]);
  return `${head(V, m)}<div class="p25-track">${ms.map(([l, d], i) => `<div class="p25-st ${d ? "p25-done" : i === next ? "p25-next" : ""}"><span class="p25-dot">${d ? "✓" : i + 1}</span><span class="p25-l">${l}</span></div>`).join("")}</div>${V.empty ? empty(V, "Milestone one: your first match") : `<div class="grid" style="margin-top:12px">${V.recs.map((r) => hitRec(r, `<b class="num" style="font-size:20px">${r.value}</b><div class="mut" style="font-size:11px">${r.label}</div>`, "p25-c")).join("")}</div>${sparseNote(V)}<div style="margin-top:12px">${tabs(V)}${logList(V, m, 5)}</div>`}`;
} });
/* 26 */
C.push({ name: "Mixtape Tracklist", idea: "A cassette J-card: side A is your greatest hits (record-setting matches), side B the full tracklist of recent results; the records are the liner notes.", render(V, m) {
  if (V.empty) return `<div class="p26-j"><div class="p26-t">COACH ${esc(DATA.coach.name).toUpperCase()} — CAREER MIX</div><p>Blank tape. Record your first match.</p><button class="cta">Play a match</button></div>`;
  const hits = [V.big, ...V.log.filter((e) => e.gf >= 3 && e.res === "W")].filter(Boolean).filter((e, i, a) => a.indexOf(e) === i).slice(0, 5);
  return `<div class="p26-j"><div class="p26-t">COACH ${esc(DATA.coach.name).toUpperCase()} — CAREER MIX · VOL ${Math.max(1, Math.ceil(V.t.p / 20))}</div><div class="p26-sides"><div><h4>SIDE A · GREATEST HITS</h4>${hits.map((e, i) => hitMatch(V, e, `<span class="p26-tr">${i + 1}. ${esc(e.opp.name)} ${e.gf}–${e.ga}</span>`)).join("") || `<span class="mut">No big wins yet.</span>`}</div><div><h4>SIDE B · LATEST</h4>${tabs(V)}${V.list.slice(0, m ? 5 : 8).map((e, i) => hitMatch(V, e, `<span class="p26-tr">${i + 1}. ${esc(e.opp.name)} ${e.gf}–${e.ga} ${e.res}</span>`)).join("")}</div></div><div class="p26-notes"><b>LINER NOTES</b> ${V.recs.map((r) => hitRec(r, `${r.label} ${r.value}`, "p26-n")).join(" · ")}</div>${sparseNote(V)}</div>`;
} });
/* 27 */
C.push({ name: "Medal Rack", idea: "A rack of medals on ribbons, one per record: gold once set, unpolished bronze outline when not. The ribbon colour is the mode; the number is engraved on the disc.", render(V, m) {
  return `${head(V, m)}<div class="p27-rack">${V.recs.map((r, i) => hitRec(r, `<span class="p27-rib" style="--c:${["#dc2626", "#2563eb", "#16a34a", "#ca8a04", "#7c3aed", "#0891b2", "#db2777", "#ea580c"][i]}"></span><span class="p27-disc num ${r.value === "—" ? "p27-off" : ""}">${r.value}</span><span class="p27-l">${r.label}</span>`, "p27-m")).join("")}</div>${V.empty ? empty(V, "No medals yet") : sparseNote(V) + `<div style="margin-top:12px">${tabs(V)}${logList(V, m, 5)}</div>`}`;
} });
/* 28 */
C.push({ name: "VHS Highlights Shelf", idea: "A shelf of VHS tapes, one per finished run, labelled in marker with its result; the record matches are 'highlights' tapes on top. Tap a tape for its line.", render(V, m) {
  if (V.empty) return `<div class="p28-shelf"><div class="p28-tape p28-blank">BLANK TAPE</div></div>` + empty(V, "Nothing taped yet");
  return `${head(V, m)}<div class="p28-shelf">${V.runs.map((r, i) => `<button class="p28-tape" data-act="s" data-v="t:${i}" aria-pressed="${sel("t:" + i)}"><span class="p28-lbl">${esc(r.title)}</span><b>${r.pos ? ord(r.pos) + " · " + r.pts + "pts" : r.wins + " wins"}</b></button>`).join("") || `<div class="p28-tape p28-blank">NO RUNS TAPED</div>`}</div>${(() => { const i = V.runs.findIndex((_, k) => sel("t:" + k)); const r = V.runs[i]; return r ? `<div class="det">${esc(r.title)} · ${fmtDay(r.day)}${r.w != null ? ` · ${r.w}W ${r.d}D ${r.l}L` : ""}</div>` : ""; })()}
  <div class="p28-hl">${V.recs.map((r) => hitRec(r, `<b class="num">${r.value}</b> ${r.label}`, "p28-h")).join("")}</div>${sparseNote(V)}<div style="margin-top:12px">${tabs(V)}${logList(V, m, 5)}</div>`;
} });
/* 29 */
C.push({ name: "Chalkboard Room", idea: "The dressing-room chalkboard: records chalked up in the coach's hand, the form guide as tally marks, the season finishes boxed — the TeamTalk pitch's world, but for the career.", render(V, m) {
  if (V.empty) return `<div class="p29-cb"><div class="p29-h">RECORDS</div><div class="p29-ch">(nothing chalked up yet)</div><div class="p29-ch">— play a match —</div></div>`;
  return `<div class="p29-cb"><div class="p29-h">RECORDS · COACH ${esc(DATA.coach.name).toUpperCase()}</div><div class="p29-cols"><div>${V.recs.map((r) => hitRec(r, `<span class="p29-ch">${r.label} — <u>${r.value}</u></span>`)).join("")}</div><div><div class="p29-ch">FORM: ${V.form.map((e) => e.res).join(" ")}</div><div class="p29-ch">TALLY: ${"卌 ".repeat(Math.floor(V.t.w / 5))}${"|".repeat(V.t.w % 5)} wins</div>${V.bestSeason ? `<div class="p29-box">${ord(V.bestSeason.pos)} · ${V.bestSeason.pts} PTS<br><small>${esc(V.bestSeason.title)}</small></div>` : ""}</div></div>${sparseNote(V)}<div style="margin-top:10px">${tabs(V)}${V.list.slice(0, m ? 5 : 8).map((e) => hitMatch(V, e, `<span class="p29-ch">${esc(e.opp.name)} ${e.gf}-${e.ga} ${e.res}</span>`)).join("")}</div></div>`;
} });
/* 30 */
C.push({ name: "Pocket Diary", idea: "A small, phone-first diary: one compact card with the three numbers that matter (win rate, biggest win, unbeaten), then a collapsible list per mode — the minimum, done well.", render(V, m) {
  if (V.empty) return `<div class="p30-card">${head(V, m)}<p class="mut">Nothing in the diary yet.</p><button class="cta">Play a match</button></div>`;
  return `<div class="p30-card">${head(V, m)}<div class="p30-three">${V.recs.slice(0, 3).map((r) => hitRec(r, `<b class="num">${r.value}</b><span class="mut">${r.label}</span>`, "p30-n")).join("")}</div><div class="row" style="margin-top:8px">${form(V, 8)}</div></div>${sparseNote(V)}
  ${modeRows(V).map((x) => `<details class="p30-d" ${R.filter === x.id || V.recent.some((e) => e.mode === x.id && sel("m:" + e.id)) ? "open" : ""}><summary><span>${x.emoji} ${esc(x.label)}</span><span class="mut num">${x.p ? `${x.w}-${x.d}-${x.l}` : ""} · ${esc(x.best)}</span></summary>${V.recent.filter((e) => e.mode === x.id).slice(0, 5).map((e) => hitMatch(V, e, `<span class="row" style="flex-wrap:nowrap">${matchLine(e)}<span class="mut" style="margin-left:auto;font-size:12px">${fmtDay(e.day)}</span></span>`, "p30-m")).join("") || `<span class="mut" style="font-size:12px">${esc(x.best)}</span>`}</details>`).join("")}
  <div class="grid" style="margin-top:10px">${V.recs.slice(3).map((r) => hitRec(r, `<b class="num">${r.value}</b> <span class="mut" style="font-size:11px">${r.label}</span>`, "p30-r")).join("")}</div>`;
} });


/* ═════════════════ GALLERY CHROME ═════════════════ */
const G = { idx: 0, theme: "dark", era: "modern", state: "full", picks: [] };
const R = { filter: "all", sel: null };
try { const s = JSON.parse(localStorage.getItem("pq-records") || "null"); if (s) { G.picks = s.picks || []; G.theme = s.theme || "dark"; G.era = s.era || "modern"; } } catch {}
const save = () => { try { localStorage.setItem("pq-records", JSON.stringify({ picks: G.picks, theme: G.theme, era: G.era })); } catch {} };
const summary = () => (G.picks.length ? "Records " + [...G.picks].sort((a, b) => a - b).map((n) => `#${n} ${C[n - 1].name}`).join(" + ") : "Records — no pick yet");
function renderPickbar() {
  document.getElementById("pickbar").innerHTML = `<b>Pick:</b> <span class="p">${esc(summary())}</span> <button id="copy">Copy</button><button id="clear">Clear</button>`;
}
function render() {
  document.body.dataset.theme = G.theme;
  const i = G.idx, c = C[i];
  document.getElementById("concept").innerHTML = C.map((x, j) => `<option value="${j}" ${j === i ? "selected" : ""}>#${j + 1} · ${x.name}</option>`).join("");
  const V = view();
  const picked = G.picks.includes(i + 1);
  const f = (m) => `<div><div class="tag">${m ? "MOBILE · 380px" : "DESKTOP · 1000px"}</div><div class="fr ${m ? "m" : "d"} K${i + 1}" data-era="${G.era}">${c.render(V, m)}</div></div>`;
  document.getElementById("main").innerHTML = `<p class="intro">/game/records — the career, read back as records. Tap a record or a match for its line; filter the log by mode. Switch Full / Sparse / Empty in the bar: a new coach sees the last two first.</p>
    <div class="chead"><h2><b>#${i + 1}</b>${esc(c.name)}</h2><button class="pickbtn ${picked ? "on" : ""}" id="pick">${picked ? "✓ Picked" : "Pick this one"}</button></div>
    <p class="why">${esc(c.idea)}</p>
    <div class="stage" id="stage"><div class="frames" id="frames">${f(false)}${f(true)}</div></div>`;
  fit(); renderPickbar();
}
function fit() {
  const st = document.getElementById("stage"), fr = document.getElementById("frames"); if (!st) return;
  const narrow = window.innerWidth < 900;
  fr.style.flexDirection = narrow ? "column" : "row"; fr.style.width = narrow ? "1000px" : "1404px";
  const w = narrow ? 1000 : 1404; const z = Math.min(1, st.clientWidth / w);
  fr.style.transform = `scale(${z})`; st.style.height = fr.offsetHeight * z + "px";
}
window.addEventListener("resize", fit);
function seg(id, list, get, set) {
  const el = document.getElementById(id);
  const sync = () => el.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === get()));
  el.innerHTML = list.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; set(b.dataset.v); sync(); save(); render(); };
  sync();
}
seg("state", [["full", "Full career"], ["sparse", "Sparse"], ["empty", "Empty"]], () => G.state, (v) => { G.state = v; R.filter = "all"; R.sel = null; });
seg("theme", [["light", "Light"], ["dark", "Dark"]], () => G.theme, (v) => (G.theme = v));
seg("era", [["retro90s", "90s"], ["goldenMillennium", "2000s"], ["modern", "Modern"]], () => G.era, (v) => (G.era = v));
document.getElementById("concept").onchange = (e) => { G.idx = +e.target.value; R.sel = null; render(); };
const step = (d) => { G.idx = (G.idx + d + C.length) % C.length; R.sel = null; render(); window.scrollTo({ top: 0 }); };
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", (e) => { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); });
document.getElementById("pickbar").addEventListener("click", (e) => {
  if (e.target.id === "copy") { const t = summary(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => (e.target.textContent = "Copied"), () => prompt("Copy your pick:", t)); }
  if (e.target.id === "clear") { G.picks = []; save(); render(); }
});
document.getElementById("main").addEventListener("click", (e) => {
  if (e.target.id === "pick") { const n = G.idx + 1; G.picks = G.picks.includes(n) ? G.picks.filter((x) => x !== n) : [...G.picks, n]; save(); render(); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "f") { R.filter = t.dataset.v; R.sel = null; }
  if (t.dataset.act === "s") R.sel = R.sel === t.dataset.v ? null : t.dataset.v;
  render();
});
render();
</script>
