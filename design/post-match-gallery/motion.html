<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vinyl Sleeve Motion</title>
<!--
  TASK-1815 — 20 LIVE entrance animations for the owner's pick, concept #23 "Vinyl Sleeve".
  Standalone: open the file directly. Every animation uses ONLY transform / opacity (the
  app's motion audit allowlist). Each design plays in a DESKTOP frame (720px) and a MOBILE
  frame (375px) side by side; "Replay" restarts that design, "Replay all" restarts every one.
-->
<style>
:root{--ui:#0f0d17;--ui-fg:#ece9f5;--ui-mut:#8f8aa3;--ui-line:#2a2638;--ease-pop:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.22,1,.36,1)}
body[data-era=modern][data-theme=light]{--bg:#fafafa;--fg:#0c0a14;--card:#fff;--mut:#52525b;--line:#e4e2ea;--pri:#a3179a;--away:#0e7c86}
body[data-era=modern][data-theme=dark]{--bg:#0c0a14;--fg:#fafafa;--card:#1a1726;--mut:#a1a1aa;--line:#2f2a40;--pri:#c91dbb;--away:#2fd4ec}
body[data-era=retro90s][data-theme=light]{--bg:#e9e0cb;--fg:#241f16;--card:#e3d8bc;--mut:#5c503a;--line:#cbbd99;--pri:#8f2b25;--away:#0e7c86}
body[data-era=retro90s][data-theme=dark]{--bg:#211c15;--fg:#ece0c4;--card:#2a2418;--mut:#b3a585;--line:#3d3424;--pri:#d2554c;--away:#2fd4ec}
body[data-era=golden][data-theme=light]{--bg:#e9f0f7;--fg:#14243a;--card:#fff;--mut:#4a5d75;--line:#cfdbe8;--pri:#11647c;--away:#0e7c86}
body[data-era=golden][data-theme=dark]{--bg:#081322;--fg:#eaf2fb;--card:#0e1a2c;--mut:#93a8c2;--line:#1d3350;--pri:#2fd4ec;--away:#2fd4ec}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ui);color:var(--ui-fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;background:#14111ef2;border-bottom:1px solid var(--ui-line)}
.bar h1{font-size:15px;margin:0 8px 0 0}
.seg{display:flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden}
.seg button,.btn{background:none;border:0;color:var(--ui-mut);padding:6px 10px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:#2b2640;color:#fff}
.btn{border:1px solid var(--ui-line);border-radius:8px;color:#fff}
main{padding:16px;max-width:1180px;margin:0 auto}
.intro{color:var(--ui-mut);max-width:780px}
.design{margin:26px 0 40px}
.design header{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.design h2{font-size:16px;margin:0}
.design h2 b{display:inline-block;min-width:34px;color:#fff;background:#2b2640;border-radius:6px;padding:1px 7px;margin-right:8px;text-align:center}
.design p.why{color:var(--ui-mut);margin:4px 0 10px;max-width:820px}
.frames{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:6px}
.frame{flex:none;background:var(--bg);color:var(--fg);border-radius:14px;border:1px solid var(--ui-line);padding:16px;container-type:inline-size;overflow:hidden}
.frame.d{width:720px}.frame.m{width:375px}
.tag{font:11px/1 system-ui;color:var(--ui-mut);margin:0 0 6px}
@media (max-width:760px){.frames{flex-direction:column}.frames>div{width:100%}.frame.d{width:100%}.frame.m{width:100%;max-width:375px}}

/* ── the shipped report, as built (PostMatchReport + globals.css .pmr-*) ── */
.pmr{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:20px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
@container (max-width:520px){.pmr{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.wrap{width:100%;max-width:230px}
.pmr svg{display:block;width:100%;height:auto;overflow:visible}
.ring{fill:none;stroke:var(--line)}.lbl{fill:currentColor;opacity:.06}.tick{stroke:var(--mut);stroke-width:2}
.spk{stroke-width:3;stroke-linecap:round;transform-box:view-box}.spk.g{stroke-width:5}
.spk.h{stroke:var(--pri)}.spk.a{stroke:var(--away)}
.score{fill:currentColor;font:800 26px system-ui}.xg{fill:var(--mut);font:10px system-ui}
.mast{margin:0;color:var(--mut);font:700 11px system-ui;letter-spacing:.18em;text-transform:uppercase}
.hl{margin:.25em 0;font:900 clamp(22px,5cqi,30px)/1.05 Georgia,serif}
.sf{margin:.4em 0 0;color:var(--mut);font-size:14px}
.key{display:flex;gap:14px;margin:8px 0 0;color:var(--mut);font-size:12px}
@container (max-width:520px){.key{justify-content:center}}
.key span::before{content:"";display:inline-block;width:10px;height:10px;margin-inline-end:5px;border-radius:50%;vertical-align:-1px}
.key .kh::before{background:var(--pri)}.key .ka::before{background:var(--away)}
.disc{transform-box:view-box;transform-origin:110px 110px}
.sweep{stroke:var(--fg);stroke-width:2;opacity:0;transform-box:view-box;transform-origin:110px 110px}
.rip{fill:none;stroke:var(--pri);opacity:0;transform-box:view-box;transform-origin:110px 110px}
.hl .w{display:inline-block}

/* ── keyframes (transform / opacity only) ── */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes growPop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes spinIn{from{transform:rotate(-360deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes spinUp{from{transform:rotate(-720deg)}to{transform:none}}
@keyframes stamp{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1)}}
@keyframes slideOut{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes sweep{0%{transform:rotate(0);opacity:.7}95%{opacity:.7}100%{transform:rotate(360deg);opacity:0}}
@keyframes flipX{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes zoomOut{from{transform:scale(1.35);opacity:0}to{transform:none;opacity:1}}
@keyframes tilt{0%{transform:rotate(-24deg) scale(.9);opacity:0}60%{transform:rotate(6deg);opacity:1}100%{transform:none}}
@keyframes ringIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ripple{0%{transform:scale(.2);opacity:.8}100%{transform:scale(1.15);opacity:0}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes drop{0%{transform:translateY(-40px);opacity:0}60%{transform:translateY(6px);opacity:1}80%{transform:translateY(-2px)}100%{transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes wordIn{from{transform:translateY(.4em);opacity:0}to{transform:none;opacity:1}}

/* Every spoke carries --i (its order, 0…n-1), --t (its minute as 0…1) and --g (1 for a goal). */
.m1 .disc{animation:spinIn .9s var(--ease-out) both}.m1 .spk{animation:grow .35s var(--ease-out) both;animation-delay:calc(.9s + var(--t)*1.4s)}.m1 .pmr-copy{animation:rise .5s .2s var(--ease-out) both}
.m2 .sweep{animation:sweep 1.8s linear both}.m2 .spk{animation:fade .2s both;animation-delay:calc(var(--t)*1.75s)}.m2 .pmr-copy{animation:fade .6s 1.6s both}
.m3 .disc{animation:spinUp 1.6s cubic-bezier(.1,.7,.2,1) both}.m3 .pmr-copy{animation:fade .6s .9s both}
.m4 .spk{animation:growPop .6s var(--ease-pop) both;animation-delay:.25s}.m4 .pmr-copy{animation:rise .5s var(--ease-out) both}
.m5 .spk{animation:grow .3s var(--ease-out) both;animation-delay:calc(var(--t)*1s)}.m5 .spk.g{animation:growPop .55s var(--ease-pop) both;animation-delay:1.25s}.m5 .pmr-copy{animation:fade .5s both}
.m6 .hl{animation:stamp .55s var(--ease-pop) both}.m6 .spk{animation:grow .3s both;animation-delay:calc(.6s + var(--i)*.06s)}.m6 .mast,.m6 .sf,.m6 .key{animation:fade .4s .5s both}
.m7 .wrap{animation:slideOut .7s var(--ease-out) both}.m7 .disc{animation:spinUp 1.2s .5s cubic-bezier(.1,.7,.2,1) both}.m7 .pmr-copy{animation:fade .5s both}
.m8 .hl .w{animation:wordIn .35s var(--ease-out) both;animation-delay:calc(var(--w)*.09s)}.m8 .spk{animation:grow .3s both;animation-delay:calc(.5s + var(--t)*1s)}.m8 .sf,.m8 .key{animation:fade .4s .7s both}
.m9 .spk{animation:grow .3s both;animation-delay:calc(var(--t)*1s)}.m9 .spk.g{animation:grow .3s calc(var(--t)*1s) both,pulse .7s calc(1.4s + var(--t)*.2s) 2}.m9 .pmr-copy{animation:fade .5s both}
.m10 .spk{animation:grow .3s both;animation-delay:calc(var(--i)*.05s + var(--h2)*.7s)}.m10 .pmr-copy{animation:fade .5s both}
.m11 .score,.m11 .xg{transform-box:fill-box;transform-origin:center;animation:flipX .5s var(--ease-out) both}.m11 .xg{animation-delay:.12s}.m11 .spk{animation:grow .3s both;animation-delay:calc(.5s + var(--t)*1s)}.m11 .pmr-copy{animation:fade .5s .3s both}
.m12 .wrap{animation:zoomOut .7s var(--ease-out) both}.m12 .pmr-copy{animation:rise .5s .35s var(--ease-out) both}
.m13 .wrap{animation:tilt .8s var(--ease-pop) both}.m13 .spk{animation:grow .3s both;animation-delay:calc(.6s + var(--i)*.04s)}.m13 .pmr-copy{animation:fade .5s .4s both}
.m14 .ring,.m14 .lbl{transform-box:view-box;transform-origin:110px 110px;animation:ringIn .5s var(--ease-out) both}.m14 .spk{animation:grow .25s both;animation-delay:calc(.5s + var(--i)*.07s)}.m14 .pmr-copy{animation:fade .4s .3s both}
.m15 .mast{animation:rise .4s var(--ease-out) both}.m15 .hl{animation:rise .4s .1s var(--ease-out) both}.m15 .sf{animation:rise .4s .2s var(--ease-out) both}.m15 .key{animation:rise .4s .3s var(--ease-out) both}.m15 .wrap{animation:fade .6s .2s both}
.m16 .spk.h{animation:grow .3s both;animation-delay:calc(var(--t)*.9s)}.m16 .spk.a{animation:grow .3s both;animation-delay:calc(1.1s + var(--t)*.9s)}.m16 .pmr-copy{animation:fade .5s both}
.m17 .rip{animation:ripple 1s var(--ease-out) both}.m17 .rip.r2{animation-delay:.2s}.m17 .spk{animation:grow .3s both;animation-delay:calc(.7s + var(--i)*.05s)}.m17 .pmr-copy{animation:fade .5s .3s both}
.m18 .disc{animation:turn 24s linear infinite}.m18 .score,.m18 .xg{animation:none}.m18 .pmr-copy{animation:fade .5s both}
.m19 .pmr{animation:drop .7s var(--ease-pop) both}
.m20 .pmr{animation:fade .3s both}
@media (prefers-reduced-motion:reduce){[class^=m] *,[class^=m]{animation:none!important}}
</style>
</head>
<body data-era="modern" data-theme="dark">
<div class="bar">
  <h1>TASK-1815 · Vinyl Sleeve — 20 animations</h1>
  <div class="seg" id="era"><button data-v="modern" aria-pressed="true">Modern</button><button data-v="golden" aria-pressed="false">Golden</button><button data-v="retro90s" aria-pressed="false">Retro 90s</button></div>
  <div class="seg" id="theme"><button data-v="dark" aria-pressed="true">Dark</button><button data-v="light" aria-pressed="false">Light</button></div>
  <button class="btn" id="all">↻ Replay all</button>
</div>
<main>
  <p class="intro">The report as built (concept #23), playing the 3–2 comeback. Every design animates only <code>transform</code> and <code>opacity</code>; with "reduce motion" switched on in your OS, everything appears instantly (that is the shipped behaviour too). Pick a number.</p>
  <div id="list"></div>
</main>
<script>
const XG={pen:76,style:{"tap-in":55,counter:30,header:18},chance:{post:20,crossbar:20,saved:12,wide:6,blocked:5}};
const EV=[[12,"a","goal","tap-in"],[20,"h","chance","saved"],[31,"a","goal","header"],[38,"h","chance","post"],[44,"a","chance","wide"],[52,"h","goal","counter"],[60,"h","chance","saved"],[66,"a","chance","blocked"],[74,"h","pen","scored"],[81,"h","chance","crossbar"],[88,"h","goal","header"],[90,"a","chance","wide"]];
const END=94, SPAN=Math.max(END,90), C=110, RING=76, INNER=48;
const shots=EV.map(([min,s,k,d])=>({min,side:s,xg:k==="pen"?XG.pen:k==="goal"?XG.style[d]:XG.chance[d],goal:k==="goal"||k==="pen"}));
const tot={h:0,a:0};shots.forEach(s=>tot[s.side]+=s.xg);
const fx=h=>{const t=Math.round(h/10);return `${Math.floor(t/10)}.${t%10}`};
const pt=(m,r)=>{const a=-Math.PI/2+m/SPAN*2*Math.PI;return [C+r*Math.cos(a),C+r*Math.sin(a)]};
const HEAD="Rovers rise from the dead";

function wheel(){
  const spokes=shots.map((s,i)=>{const len=6+s.xg*.3,[x1,y1]=pt(s.min,RING),[x2,y2]=pt(s.min,s.side==="h"?RING+len:RING-len);
    return `<line class="spk ${s.side}${s.goal?" g":""}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" style="transform-origin:${x1.toFixed(1)}px ${y1.toFixed(1)}px;--i:${i};--t:${(s.min/SPAN).toFixed(3)};--h2:${s.min>45?1:0}"/>`}).join("");
  return `<div class="wrap" dir="ltr"><svg viewBox="0 0 220 220" role="img" aria-label="xG wheel">
    <circle class="rip" cx="110" cy="110" r="90"/><circle class="rip r2" cx="110" cy="110" r="90"/>
    <g class="disc"><circle cx="110" cy="110" r="${RING}" class="ring"/><circle cx="110" cy="110" r="${INNER}" class="lbl"/><line x1="110" y1="${110-RING-4}" x2="110" y2="${110-RING+4}" class="tick"/>${spokes}</g>
    <line class="sweep" x1="110" y1="110" x2="110" y2="${110-RING-30}"/>
    <text x="110" y="108" text-anchor="middle" class="score">3–2</text><text x="110" y="126" text-anchor="middle" class="xg">xG ${fx(tot.h)}–${fx(tot.a)}</text></svg></div>`;
}
function report(){
  const words=HEAD.split(" ").map((w,i)=>`<span class="w" style="--w:${i}">${w}</span>`).join(" ");
  return `<section class="pmr">${wheel()}<div class="pmr-copy"><p class="mast">The Final Whistle</p><h3 class="hl">${words}</h3><p class="sf">Kane 2, Saka · Brown, Green — xG ${fx(tot.h)}–${fx(tot.a)}</p><p class="key"><span class="kh">Rovers</span><span class="ka">United</span></p></div></section>`;
}
const D=[
 ["Needle Drop","The record spins in, then each shot's spoke grows in minute order — the match replays around the disc."],
 ["Clock Sweep","A hand sweeps the 90 minutes; each spoke appears as the hand passes its minute."],
 ["Spin Up","The finished record spins up from two turns and settles, everything already on it."],
 ["Spoke Bloom","Every spoke springs out of the ring at once with a pop."],
 ["Goals Last","Chances draw in minute order, then the goals pop in last with an overshoot."],
 ["Headline Stamp","The headline is stamped down first; the spokes follow in a quick run."],
 ["Out of the Sleeve","The record slides out from behind the copy, then spins into place."],
 ["Word by Word","The headline sets word by word while the spokes grow by minute."],
 ["Goal Pulse","Spokes grow by minute; goal spokes then pulse twice to draw the eye."],
 ["Half by Half","First-half spokes, a beat for half-time, then the second half."],
 ["Score Flip","The centre score flips over like a scoreboard card, then the spokes grow."],
 ["Zoom Out","The record arrives from close-up and settles; the copy rises after."],
 ["Tilt & Settle","The disc tips in at an angle and springs flat, spokes running round it."],
 ["Ring Draw","The ring and label open out from the centre, then the spokes tick on."],
 ["Copy Cascade","Masthead, headline, standfirst and key rise in a stagger; the wheel fades."],
 ["Home, then Away","The home side's spokes go out first, then the away side's come in."],
 ["Ripple","Two rings ripple out from the centre like a needle drop, then spokes."],
 ["Turntable","No entrance — the record turns slowly and continuously while it is on screen."],
 ["Drop In","The whole card drops into place with a small bounce."],
 ["Minimal Fade","A plain 300ms fade. Quietest option."],
];
function card(i){const [n,why]=D[i];return `<section class="design" id="m${i+1}"><header><h2><b>${i+1}</b>${n}</h2><button class="btn" data-replay="${i}">↻ Replay</button></header><p class="why">${why}</p><div class="frames"><div><p class="tag">Desktop · 720</p><div class="frame d m${i+1}">${report()}</div></div><div><p class="tag">Mobile · 375</p><div class="frame m m${i+1}">${report()}</div></div></div></section>`}
const list=document.getElementById("list");
list.innerHTML=D.map((_,i)=>card(i)).join("");
list.addEventListener("click",e=>{const b=e.target.closest("[data-replay]");if(!b)return;const i=+b.dataset.replay;document.getElementById(`m${i+1}`).outerHTML=card(i)});
document.getElementById("all").onclick=()=>{list.innerHTML=D.map((_,i)=>card(i)).join("")};
function seg(id,apply){const el=document.getElementById(id);el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));apply(b.dataset.v)})}
seg("era",v=>document.body.dataset.era=v);seg("theme",v=>document.body.dataset.theme=v);
</script>
</body>
</html>
