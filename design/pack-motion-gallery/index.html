<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pack Motion Gallery</title>
<!--
  MOTION gallery for ONE moment: the Mystery Market pack reveal (TASK-1818), on the owner's
  layout pick "Pack #1 — Three-Card Table" from design/polish-gallery. 20 motion designs, each
  playing in a DESKTOP (1000px) and a MOBILE (380px) frame: cards arrive face-down → Open →
  reveal → keep one (the kept card confirms, the other two leave).

  Every design obeys the app's motion audit:
    · @keyframes animate ONLY transform / opacity / box-shadow (build.py re-checks this)
    · every animation is finite; the reveal (Open → choosable) ends inside ~2.5 s
    · a card is footprint (.slot) → mover (.mv) → scaler (.sc, static scale) → flipper (.fl),
      and the flipper turns a real 180° from the CardBack face to the reward face
    · prefers-reduced-motion: reduce removes every animation and transition; the reveal is
      then instant. The "Reduced motion" toggle simulates it.

  Built from template.html by build.py (embeds data.json + the real gameMarket copy from
  src/i18n/messages/en.json). Standalone: no network, no external fonts or scripts.
-->
<style>
:root{--ui:#0f0d17;--ui-fg:#ece9f5;--ui-mut:#8f8aa3;--ui-line:#2a2638}
body[data-theme=light]{--bg:#f6f5f9;--fg:#15121e;--card:#fff;--mut:#5d5a70;--line:#e2dfea}
body[data-theme=dark]{--bg:#0e0c15;--fg:#f2f0f8;--card:#1a1726;--mut:#a29eb5;--line:#302b42}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ui);color:var(--ui-fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.top-sticky{position:sticky;top:0;z-index:10}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:9px 16px;background:#14111ef5;border-bottom:1px solid var(--ui-line)}
.bar h1{font-size:15px;margin:0 6px 0 0}
.seg{display:flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--ui-mut);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:#2b2640;color:#fff}
.nav{display:flex;gap:6px;align-items:center}
.nav button,.ctl button,.pickbar button{background:#1d1929;color:#fff;border:1px solid var(--ui-line);border-radius:8px;padding:5px 10px;cursor:pointer}
.ctl button.pri{background:#86efac;color:#052e16;border-color:#86efac;font-weight:800}
select{background:#1d1929;color:#fff;border:1px solid var(--ui-line);border-radius:8px;padding:5px 8px;font:inherit;max-width:280px}
.pickbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:7px 16px;background:#1b1628f2;border-bottom:1px solid var(--ui-line);font-size:13px}
.pickbar b{color:#fff}.pickbar .p{color:var(--ui-mut)}.pickbar .p.on{color:#86efac}
main{padding:16px;max-width:1500px;margin:0 auto}
.chead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:4px 0 6px}
.chead h2{margin:0;font-size:18px}
.chead h2 b{display:inline-block;min-width:38px;color:#fff;background:#2b2640;border-radius:6px;padding:1px 8px;margin-right:8px;text-align:center}
.why{color:var(--ui-mut);margin:0 0 4px;max-width:980px}
.tl{color:#c4b5fd;font-size:12px;margin:0 0 8px}
.pickbtn{background:#86efac;color:#052e16;border:0;border-radius:999px;padding:7px 16px;font-weight:800;cursor:pointer}
.pickbtn.on{background:#14532d;color:#bbf7d0;outline:2px solid #86efac}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;color:var(--ui-mut);font-size:12px}
.stage{overflow:hidden}
.frames{display:flex;gap:24px;align-items:flex-start;width:1404px;transform-origin:0 0}
.tag{font:11px/1 system-ui;color:var(--ui-mut);margin:0 0 6px}
.fr{background:var(--bg);color:var(--fg);border-radius:14px;border:1px solid var(--ui-line);padding:16px;overflow:hidden;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;--s:1}
.fr.d{width:1000px}.fr.m{width:380px;padding:12px;--s:.6}
.intro{color:var(--ui-mut);max-width:980px;margin:0 0 10px}
.rmnote{display:none;background:#3b2f0b;color:#fde68a;border-radius:8px;padding:6px 10px;margin:0 0 10px;font-size:12px}
body.rm .rmnote{display:block}

/* ════════ Pack #1 "Three-Card Table" — the owner's layout pick, unchanged ════════ */
.fr .top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline}
.fr .top h3{margin:0;font-size:24px}
.fr.m .top h3{font-size:20px}
.fr .mut{color:var(--mut)}
.fr .sub{color:var(--mut);margin:4px 0 10px;font-size:13px}
.tbl{position:relative;overflow:hidden;background:radial-gradient(#1f6f43,#0f3d24);border-radius:20px;padding:20px;color:#fff;text-align:center}
.fr.m .tbl{padding:14px 10px}
.tbl .pt{margin:0;font-size:20px}
.fr.m .tbl .pt{font-size:17px}
.tbl .hint{margin:4px 0 0;opacity:.85}
.fr.m .tbl .hint{font-size:13px}
.row,.go,.kl{position:relative;z-index:1}
.row{display:flex;justify-content:center;gap:18px;margin:16px 0}
.fr.m .row{gap:6px;margin:12px 0}
.go{display:none;background:#fde68a;color:#3b2a10;border:0;border-radius:999px;padding:11px 22px;font-weight:900;cursor:pointer}
.tbl:is([data-ph=arrive],[data-ph=closed]) .go{display:inline-block}
.kl{display:none;background:rgba(0,0,0,.28);border-radius:12px;padding:10px 12px;margin:0 auto;max-width:560px;font-size:13px}
.tbl[data-ph=keep] .kl{display:block}
.kl p{margin:0 0 8px}.kl .c{color:#fecaca}
.kl button{background:#fde68a;color:#3b2a10;border:0;border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer}

/* the card: footprint → mover → scaler → flipper */
.slot{position:relative;flex:none;width:calc(176px * var(--s));height:calc(256px * var(--s));padding:0;margin:0;border:0;background:none;perspective:1100px;-webkit-tap-highlight-color:transparent;cursor:default}
.tbl[data-ph=open] .slot{cursor:pointer}
.slot:focus-visible{outline:3px solid #fde68a;outline-offset:4px;border-radius:12px}
.mv{position:absolute;inset:0;border-radius:calc(14px * var(--s))}
.ring{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.sc{position:absolute;left:0;top:0;width:176px;height:256px;transform:scale(var(--s));transform-origin:0 0;perspective:900px}
.fl{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(0)}
.tbl:is([data-ph=reveal],[data-ph=open],[data-ph=keep]) .fl{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* CardBack (PlayerCard.tsx BACK_STYLES K01/K02/K07/K09) */
.back{overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 16px 34px -16px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.1)}
.back .ov{position:absolute;inset:0;z-index:1}
.back .wm{font:700 42px/1 "Oswald","Arial Narrow",system-ui,sans-serif;z-index:3;text-shadow:0 3px 8px rgba(0,0,0,.4)}
.back .word{font-size:9px;letter-spacing:.42em;text-transform:uppercase;font-weight:700;z-index:3;opacity:.9}
.back .yr{position:absolute;bottom:9px;font:700 9px ui-monospace,monospace;letter-spacing:.2em;opacity:.7;z-index:3}
/* reward face (Pack #1 .rw) */
.front{transform:rotateY(180deg);background:#fff;color:#111;border:3px solid #fde68a;padding:12px 10px;display:flex;flex-direction:column;gap:6px;text-align:start}
.front .ic{font-size:30px;text-align:center;line-height:1.1}
.front .nm{font-size:15px;text-align:center;line-height:1.2}
.front .bn{font-size:12.5px;color:#15803d;font-weight:600;line-height:1.3}
.front .ct{font-size:12.5px;color:#b91c1c;font-weight:600;line-height:1.3;margin-top:auto}
.fr.m .front{padding:10px 9px;gap:5px}
.fr.m .front .ic{font-size:32px}
.fr.m .front .nm{font-size:19px}
.fr.m .front .bn,.fr.m .front .ct{font-size:16px;line-height:1.22}
.front .risk{display:none;align-items:center;justify-content:center;gap:3px;font:800 9px system-ui;letter-spacing:.12em;color:#7f1d1d}
.front .risk i{width:14px;height:5px;border-radius:2px;background:#e5e7eb}
.front .risk i.on{background:#ef4444}
.fr.m .front .risk{font-size:13px}.fr.m .front .risk i{width:20px;height:7px}
.front .stk{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-12deg);opacity:0;border:3px solid #15803d;color:#15803d;background:rgba(255,255,255,.88);border-radius:6px;padding:3px 12px;font:900 24px/1.1 system-ui;letter-spacing:.08em;pointer-events:none}
.fr.m .front .stk{font-size:32px}
/* effect layers (invisible at rest) */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none}
.burst{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(255,247,200,.95),rgba(253,230,138,.5) 35%,transparent 68%);opacity:0;pointer-events:none;z-index:3}
.fr.m .burst{width:200px;height:200px;margin:-100px 0 0 -100px}
.spot{position:absolute;top:-24%;height:148%;left:50%;width:260px;margin-left:-130px;background:radial-gradient(ellipse at center,rgba(255,250,215,.42),rgba(255,250,215,.12) 45%,transparent 70%);opacity:0;pointer-events:none;z-index:3}
.fr.m .spot{width:150px;margin-left:-75px}

/* rest states for the kept / the dismissed */
.tbl[data-ph=keep] .slot.gone{pointer-events:none}
.tbl[data-ph=keep] .slot.gone .mv{opacity:0}
.tbl[data-ph=keep] .slot.kept{z-index:2}
.tbl[data-ph=open] .mv{transition:transform .18s ease,box-shadow .18s ease}
.tbl[data-ph=open] .slot:hover .mv,.tbl[data-ph=open] .slot:focus-visible .mv{transform:translateY(-6px);box-shadow:0 14px 26px -12px rgba(0,0,0,.7)}

/* ════════ shared keyframes ════════ */
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
@keyframes a-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes a-fade-out{from{opacity:1}to{opacity:0}}
@keyframes a-shrink{from{opacity:1;transform:none}to{opacity:0;transform:scale(.6)}}
@keyframes a-scale-in{from{transform:none}to{transform:scale(1.05)}}
@keyframes kl-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes go-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.tbl[data-ph=arrive] .mv{animation:a-rise .45s cubic-bezier(.2,.8,.2,1) calc(var(--i) * 80ms) both}
.tbl[data-ph=closed] .go{animation:go-in .3s ease both}
.tbl[data-ph=keep] .gone .mv{animation:a-fade-out .4s ease both}
.tbl[data-ph=keep] .kl{animation:kl-in .4s ease .45s both}

/* ════════ 20 DESIGNS ════════ */
/* M1 Triple Flip */
@keyframes m1-hop{0%,100%{transform:none}45%{transform:translateY(-16px) scale(1.04)}}
@keyframes m1-keep{0%{transform:none;box-shadow:0 0 0 0 rgba(253,230,138,0)}55%{transform:scale(1.12);box-shadow:0 0 0 4px #fde68a,0 0 40px 12px rgba(253,230,138,.7)}100%{transform:scale(1.06);box-shadow:0 0 0 3px #fde68a,0 0 26px 6px rgba(253,230,138,.5)}}
@keyframes m1-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(34px) scale(.9)}}
.M1 [data-ph=reveal] .mv{animation:m1-hop .7s cubic-bezier(.3,.7,.3,1) both}
.M1 [data-ph=reveal] .fl{animation:flip .6s cubic-bezier(.45,.05,.2,1) .06s both}
.M1 [data-ph=keep] .kept .mv{transform:scale(1.06);box-shadow:0 0 0 3px #fde68a,0 0 26px 6px rgba(253,230,138,.5);animation:m1-keep .6s ease both}
.M1 [data-ph=keep] .gone .mv{animation:m1-out .45s ease-in both}

/* M2 Domino Run */
@keyframes m2-in{from{opacity:0;transform:translateX(-70px) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes m2-tip{0%,100%{transform:none}50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes m2-topple{0%{opacity:1;transform:none}60%{opacity:1}100%{opacity:0;transform:rotate(calc(var(--away) * 84deg))}}
@keyframes m2-bump{0%,100%{transform:none}40%{transform:translateY(-12px) scale(1.05)}}
.M2 [data-ph=arrive] .mv{animation:m2-in .45s cubic-bezier(.2,.8,.2,1) calc(var(--i) * 110ms) both}
.M2 [data-ph=reveal] .mv{animation:m2-tip .5s ease calc(var(--i) * 150ms) both}
.M2 [data-ph=reveal] .fl{animation:flip .5s cubic-bezier(.5,0,.2,1) calc(var(--i) * 150ms) both}
.M2 [data-ph=keep] .gone .mv{transform-origin:50% 100%;animation:m2-topple .55s cubic-bezier(.5,0,.8,.4) calc(var(--far) * 130ms) both}
.M2 [data-ph=keep] .kept .mv{animation:m2-bump .5s ease .35s both}

/* M3 Shake & Burst */
@keyframes m3-shake{0%,80%,100%{transform:none}10%{transform:translateX(-7px) rotate(-1deg)}20%{transform:translateX(7px) rotate(1deg)}30%{transform:translateX(-6px) rotate(-.8deg)}40%{transform:translateX(6px) rotate(.8deg)}50%{transform:translateX(-4px)}60%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
@keyframes m3-burst{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
@keyframes m3-pop{0%{transform:scale(.92)}60%{transform:scale(1.1)}100%{transform:none}}
@keyframes m3-kpop{0%{transform:none}40%{transform:scale(1.16)}100%{transform:scale(1.05)}}
@keyframes m3-blow{from{opacity:1;transform:none}to{opacity:0;transform:translate(calc(var(--away) * 140px),-40px) rotate(calc(var(--away) * 28deg))}}
@keyframes m3-kburst{0%{opacity:0;transform:translateX(var(--kx)) scale(.3)}30%{opacity:.9}100%{opacity:0;transform:translateX(var(--kx)) scale(1.8)}}
.M3 [data-ph=reveal] .row{animation:m3-shake .6s linear both}
.M3 [data-ph=reveal] .burst{animation:m3-burst .7s ease-out .55s both}
.M3 [data-ph=reveal] .mv{animation:m3-pop .45s cubic-bezier(.3,1.6,.5,1) .55s both}
.M3 [data-ph=reveal] .fl{animation:flip .38s cubic-bezier(.3,0,.2,1) .55s both}
.M3 [data-ph=keep] .kept .mv{transform:scale(1.05);animation:m3-kpop .45s cubic-bezier(.3,1.5,.5,1) both}
.M3 [data-ph=keep] .gone .mv{animation:m3-blow .5s cubic-bezier(.4,0,1,1) both}
.M3 [data-ph=keep] .burst{animation:m3-kburst .55s ease-out both}

/* M4 Deal from the Deck */
@keyframes m4-deal{0%{opacity:0;transform:translate(var(--dx),-150px) rotate(-18deg) scale(.8)}15%{opacity:1}100%{opacity:1;transform:none}}
@keyframes m4-snap{0%,100%{transform:none}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes m4-back{0%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-150px) rotate(-18deg) scale(.8)}}
@keyframes m4-lift{from{transform:none;box-shadow:0 0 0 0 rgba(0,0,0,0)}to{transform:translateY(-10px) scale(1.05);box-shadow:0 22px 36px -14px rgba(0,0,0,.75)}}
.M4 [data-ph=arrive] .mv{animation:m4-deal .5s cubic-bezier(.2,.75,.25,1) calc(var(--i) * 180ms) both}
.M4 [data-ph=reveal] .mv{animation:m4-snap .48s ease calc(var(--i) * 170ms) both}
.M4 [data-ph=reveal] .fl{animation:flip .48s cubic-bezier(.4,0,.2,1) calc(var(--i) * 170ms) both}
.M4 [data-ph=keep] .gone .mv{animation:m4-back .55s cubic-bezier(.5,0,.75,0) calc(var(--far) * 100ms) both}
.M4 [data-ph=keep] .kept .mv{transform:translateY(-10px) scale(1.05);box-shadow:0 22px 36px -14px rgba(0,0,0,.75);animation:m4-lift .45s ease both}

/* M5 The Tease */
@keyframes m5-tease{0%{transform:none}8%{transform:translateY(-6px) rotate(-4deg)}16%{transform:translateY(-10px) rotate(4deg)}24%{transform:translateY(-12px) rotate(-3deg)}32%,68%{transform:translateY(-14px) scale(1.07)}82%,100%{transform:none}}
@keyframes m5-dim{0%{opacity:1}15%,70%{opacity:.4}85%,100%{opacity:1}}
@keyframes m5-rise{from{transform:none}to{transform:translateY(-12px) scale(1.05)}}
.M5 [data-ph=reveal] .risky .mv{animation:m5-tease 2.1s ease both}
.M5 [data-ph=reveal] .risky .fl{animation:flip .8s cubic-bezier(.65,0,.25,1) .7s both}
.M5 [data-ph=reveal] .slot:not(.risky) .mv{animation:m5-dim 2.1s ease both}
.M5 [data-ph=reveal] .slot:not(.risky) .fl{animation:flip .5s cubic-bezier(.4,0,.2,1) 1.55s both}
.M5 [data-ph=keep] .kept .mv{transform:translateY(-12px) scale(1.05);animation:m5-rise .6s cubic-bezier(.2,.8,.2,1) both}
.M5 [data-ph=keep] .gone .mv{animation:a-fade-out .9s ease both}

/* M6 Spotlight Sweep */
@keyframes m6-dim{0%{opacity:0}15%,85%{opacity:1}100%{opacity:0}}
@keyframes m6-sweep{0%{opacity:0;transform:translateX(calc(var(--rw) * -1.15))}12%{opacity:1}88%{opacity:1;transform:translateX(calc(var(--rw) * 1.15))}100%{opacity:0;transform:translateX(calc(var(--rw) * 1.15))}}
@keyframes m6-flare{0%{box-shadow:0 0 0 0 rgba(255,250,200,0)}40%{box-shadow:0 0 36px 10px rgba(255,250,200,.85)}100%{box-shadow:0 0 0 0 rgba(255,250,200,0)}}
@keyframes m6-land{from{opacity:0;transform:translateX(var(--kx)) scale(1.8)}to{opacity:1;transform:translateX(var(--kx))}}
@keyframes m6-dimin{from{opacity:0}to{opacity:1}}
.M6 [data-ph=reveal] .dim{animation:m6-dim 2.2s ease both}
.M6 [data-ph=reveal] .spot{animation:m6-sweep 1.7s cubic-bezier(.45,0,.55,1) .1s both}
.M6 [data-ph=reveal] .fl{animation:flip .5s cubic-bezier(.4,0,.2,1) calc(.38s + var(--i) * .45s) both}
.M6 [data-ph=reveal] .front{animation:m6-flare .6s ease calc(.8s + var(--i) * .45s) both}
.M6 [data-ph=keep] .spot{opacity:1;transform:translateX(var(--kx));animation:m6-land .55s ease-out both}
.M6 [data-ph=keep] .dim{opacity:1;animation:m6-dimin .45s ease both}
.M6 [data-ph=keep] .gone .mv{animation:a-fade-out .5s ease both}

/* M7 Danger Glow */
@keyframes m7-pulse{0%,100%{box-shadow:0 0 0 3px #ef4444,0 0 18px 4px rgba(239,68,68,.55)}50%{box-shadow:0 0 0 5px #ef4444,0 0 46px 16px rgba(239,68,68,.85)}}
@keyframes m7-calm{from{box-shadow:0 0 0 0 rgba(34,197,94,0),0 0 0 0 rgba(34,197,94,0)}to{box-shadow:0 0 0 3px #22c55e,0 0 16px 3px rgba(34,197,94,.45)}}
@keyframes m7-gold{from{box-shadow:0 0 0 0 rgba(253,230,138,0),0 0 0 0 rgba(253,230,138,0)}to{box-shadow:0 0 0 3px #fde68a,0 0 30px 8px rgba(253,230,138,.6)}}
.M7 .front .risk{display:flex}
.M7 [data-ph=reveal] .fl{animation:flip .5s cubic-bezier(.4,0,.2,1) calc(var(--i) * 120ms) both}
.M7 :is([data-ph=reveal],[data-ph=open]) .risky .front{box-shadow:0 0 0 3px #ef4444,0 0 18px 4px rgba(239,68,68,.55)}
.M7 [data-ph=reveal] .risky .front{animation:m7-pulse .45s ease-in-out .9s 3 both}
.M7 :is([data-ph=reveal],[data-ph=open]) .safe .front{box-shadow:0 0 0 3px #22c55e,0 0 16px 3px rgba(34,197,94,.45)}
.M7 [data-ph=reveal] .safe .front{animation:m7-calm .5s ease .9s both}
.M7 [data-ph=keep] .kept .front{box-shadow:0 0 0 3px #fde68a,0 0 30px 8px rgba(253,230,138,.6);animation:m7-gold .6s ease both}
.M7 [data-ph=keep] .kept .mv{transform:scale(1.05);animation:a-scale-in .5s ease both}

/* M8 Stamp Slam */
@keyframes m8-stamp{0%{opacity:0;transform:scale(2.6) rotate(-16deg)}55%{opacity:1;transform:scale(.9) rotate(-3deg)}75%{transform:scale(1.04) rotate(-4deg)}100%{opacity:1;transform:rotate(-4deg)}}
@keyframes m8-jolt{0%,100%{transform:none}35%{transform:translateY(5px) scale(.97)}}
@keyframes m8-kept{0%{opacity:0;transform:translate(-50%,-50%) scale(3) rotate(-24deg)}60%{opacity:1;transform:translate(-50%,-50%) scale(.92) rotate(-11deg)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg)}}
.M8 .front .ct{border:2px solid #b91c1c;border-radius:5px;padding:3px 6px;transform:rotate(-4deg);background:#fef2f2}
.M8 [data-ph=reveal] .fl{animation:flip .55s cubic-bezier(.4,0,.2,1) both}
.M8 [data-ph=reveal] .ct{animation:m8-stamp .38s cubic-bezier(.5,0,.75,0) calc(.75s + var(--i) * .35s) both}
.M8 [data-ph=reveal] .mv{animation:m8-jolt .26s ease calc(.96s + var(--i) * .35s) both}

<script>
const DATA = {"note": "Gallery-only extras. The copy (title, hint, rewards' name/boon/catch) is read from src/i18n/messages/en.json gameMarket by build.py. Risk tiers are a gallery device for the designs that single out the riskiest card.", "icons": {"marquee": "⭐", "wonderkid": "🌱", "gegenpress": "⚡", "ironCurtain": "🛡️", "talismanTonic": "🧪", "physio": "➕"}, "risk": {"marquee": 3, "wonderkid": 3, "physio": 3, "gegenpress": 2, "talismanTonic": 2, "ironCurtain": 1}, "rewards": ["marquee", "wonderkid", "gegenpress", "ironCurtain", "talismanTonic", "physio"], "backs": {"K01": {"root": "repeating-linear-gradient(90deg,#141922 0 7px,#1b2333 7px 8px)", "ov": "radial-gradient(60% 50% at 50% 40%,rgba(231,193,91,.18),transparent)", "ovSize": "auto", "wm": "#e7c15b", "glow": "#e7c15b"}, "K02": {"root": "radial-gradient(#d59e30,#8a5f16)", "ov": "radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.4px)", "ovSize": "9px 9px", "wm": "#241802", "glow": "#f2c14e"}, "K07": {"root": "radial-gradient(120% 90% at 50% 0,#3a1030,#0a0710)", "ov": "radial-gradient(rgba(224,33,138,.4) 1px,transparent 1.4px)", "ovSize": "11px 11px", "wm": "#e0218a", "glow": "#e0218a"}, "K09": {"root": "#0b1018", "ov": "linear-gradient(90deg,rgba(46,197,182,.16) 1px,transparent 0),linear-gradient(0deg,rgba(46,197,182,.16) 1px,transparent 0)", "ovSize": "18px 18px", "wm": "#2ec5b6", "glow": "#2ec5b6"}}, "brand": "φ", "wordmark": "PitchIQ", "season": "2025/26", "best": {"wins": 4, "rounds": 7}, "lives": 3, "copy": {"title": "Mystery Market", "subtitle": "Start with the weakest XI in the market. Win to open a pack of three mystery rewards — every one a big boost with a catch. {lives} defeats and the run is over.", "noBest": "No run finished yet.", "best": "Best run: {wins} wins in {rounds} matches", "start": "Start a run", "again": "Start a new run", "over": "Run over", "overLine": "{wins} wins in {rounds} matches.", "saveError": "This run could not be saved. Try again before playing on.", "yourSide": "Your XI", "opponent": "Round {n} rivals", "livesAria": "{n} lives left", "wins": "{n} wins", "round": "Round {n}", "matchesLeft": "{n} more", "squad": "Your XI", "nextHome": "Next match at home.", "nextAway": "Next match away.", "play": "Play round {n}", "packTitle": "You won — a mystery pack", "packHint": "Three rewards, face down. Every one has a catch.", "packPick": "Keep ONE. Choose carefully.", "open": "Open the pack", "forced": {"hotHead": "Hot-Head", "talisman": "Talisman"}, "reward": {"marquee": {"name": "Marquee Signing", "boon": "An 85+ star replaces your weakest player", "catch": "He's a Hot-Head — fouls and cards"}, "wonderkid": {"name": "Wonderkid", "boon": "A player well above your average joins", "catch": "Your best outfielder is sold"}, "gegenpress": {"name": "Gegenpress", "boon": "Big attacking lift for 2 matches", "catch": "Legs go after 70' — attack collapses late"}, "ironCurtain": {"name": "Iron Curtain", "boon": "Tighter defence for the rest of the run", "catch": "Blunter attack for the rest of the run"}, "talismanTonic": {"name": "Talisman Tonic", "boon": "Your best player becomes a Talisman", "catch": "The pressure shows — more cards, all run"}, "physio": {"name": "Physio", "boon": "Win back a life", "catch": "Every opponent from now on is a tier stronger"}}, "back": "Back to the run"}};
const T = DATA.copy;
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (k in o ? o[k] : `{${k}}`));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ═════════ the pack (three of the six real rewards, seeded) ═════════ */
const BACK_ORDER = ["K01", "K07", "K09", "K02"];
function dealPack(seed) {
  const r = mulberry32(5150 + seed * 7), bag = [...DATA.rewards];
  for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  const cards = bag.slice(0, 3).map((id, i) => ({ id, ic: DATA.icons[id], risk: DATA.risk[id], ...T.reward[id], back: BACK_ORDER[(seed + i) % 4] }));
  const rs = cards.map((c) => c.risk), hi = Math.max(...rs), lo = Math.min(...rs);
  return { cards, risky: rs.indexOf(hi), safe: lo < hi ? rs.indexOf(lo) : -1 };
}

/* ═════════ 20 designs: name, idea, and how long each phase runs (ms) ═════════ */
const D = [];
D.push({ name: "Triple Flip", idea: "The confident baseline: the three cards rise onto the felt, and on Open all three hop and turn over TOGETHER in one beat. The kept card swells with a gold halo; the other two sink off the table.", t: { arrive: 650, reveal: 720, keep: 700 } });
D.push({ name: "Domino Run", idea: "Cards slide in from the left one after another; Open turns them over left → right like falling dominoes, each with a small tip. On a keep, the other two topple over AWAY from your card, the far one last.", t: { arrive: 700, reveal: 820, keep: 800 } });
D.push({ name: "Shake & Burst", idea: "Loot-box tension: Open makes the whole row shudder, then a burst of light blows the cards over in one fast snap with a springy pop. Keep pops your card and blows the other two off the sides of the table.", t: { arrive: 500, reveal: 1300, keep: 650 } });
D.push({ name: "Deal from the Deck", idea: "A dealer's hand: each card is flicked from a deck above the table to its place; Open turns them in deal order. The two you leave are swept back up into the deck; yours lifts off the felt with a shadow under it.", t: { arrive: 900, reveal: 860, keep: 800 } });
D.push({ name: "The Tease", idea: "Pure suspense: the RISKIEST card wobbles, lifts and turns alone while the other two dim and wait — then they flip together once it has landed. Keep is calm: your card rises, the others fade slowly.", t: { arrive: 500, reveal: 2100, keep: 900 } });
D.push({ name: "Spotlight Sweep", idea: "The felt goes dark and a spotlight sweeps left → right; each card turns as the light passes and flares as it lands. On a keep the spotlight drops onto your card and stays there while the others fade into the dark.", t: { arrive: 500, reveal: 2300, keep: 600 } });
D.push({ name: "Danger Glow", idea: "Rarity-glow for RISK: after a staggered flip the riskiest reward throbs red three times and the safest settles in green, each face carrying a risk meter. Keep turns your card's glow to gold — a deliberate gamble.", t: { arrive: 500, reveal: 2250, keep: 650 } });
D.push({ name: "Stamp Slam", idea: "All three turn together, then each card's CATCH is slammed onto it as a red stamp, one after another, with the card jolting on each impact. Keeping one slams a big KEPT stamp across it.", t: { arrive: 500, reveal: 1950, keep: 750 } });
D.push({ name: "Sticker Slap + Stamp", idea: "The past hybrid made for loot: the BOON slaps onto each card as a green sticker in turn, then all three catches stamp down at once and the table thuds. Keep slaps a KEPT sticker on yours and peels the others away.", t: { arrive: 500, reveal: 2150, keep: 700 } });
D.push({ name: "Pick-Up Lift", idea: "Cards lie flat on the felt (tilted back in perspective); Open picks each one up off the table and turns it in your hand. Hover lifts a card higher. Keep raises yours high with a deep shadow; the others are laid back down.", t: { arrive: 700, reveal: 1150, keep: 600 } });
D.push({ name: "Forward Pass", idea: "Built around the CHOICE: a quick synchronised flip with a little overshoot, then the kept card slides forward to the centre, grows and takes a gold rim while the other two drop off the front of the table.", t: { arrive: 700, reveal: 650, keep: 750 } });
D.push({ name: "Roulette Spin", idea: "Every card spins like a wheel and decelerates, stopping one after another on its reward face with a tick. Keep gives your card a victory twirl; the others shrink away.", t: { arrive: 500, reveal: 1950, keep: 750 } });
D.push({ name: "Heartbeat", idea: "The cards breathe twice as they arrive; Open quickens the pulse — three heartbeats, each harder with a red glow — then they turn on the last beat. Keep gives your card one golden beat; the others shrink out.", t: { arrive: 1300, reveal: 1700, keep: 650 } });
D.push({ name: "Fan Spread", idea: "The pack is dealt as a HAND: the cards fan out from one stack into a slight arc; Open straightens them from the centre outwards as they turn. The two you leave fold back under your card.", t: { arrive: 850, reveal: 850, keep: 650 } });
D.push({ name: "Shockwave", idea: "The centre card turns first and its landing sends a gold shockwave that knocks its neighbours over too. Keep fires a bigger ring from your card that pushes the other two off the table.", t: { arrive: 500, reveal: 1300, keep: 700 } });
D.push({ name: "Vault Drop", idea: "Weight and impact: the cards drop onto the table from above and bounce with a squash; Open throws them up so they turn in the air and land with a thud. Keep bounces yours; the others fall through the table.", t: { arrive: 1150, reveal: 1100, keep: 750 } });
D.push({ name: "Slow Burn", idea: "The table dims and each card turns SLOWLY, hanging edge-on for a beat before it falls open; the boon rises in first and the catch only after it. Keep is slow and deliberate — a long rise and a long fade.", t: { arrive: 500, reveal: 2400, keep: 1000 } });
D.push({ name: "Neon Charge", idea: "Each card charges up in its own CardBack colour (gold, pink, teal), buzzing as the glow builds, then snaps over as the charge releases. Your kept card holds its colour; the others flicker and power down.", t: { arrive: 500, reveal: 1600, keep: 650 } });
D.push({ name: "Card Sharp", idea: "A shell game: Open swaps the outer cards twice past the middle one before they all turn over (they finish where they started, so nothing is hidden). Keep slides yours to the centre while the others slide off the sides.", t: { arrive: 500, reveal: 1950, keep: 650 } });
D.push({ name: "Jackpot Stops", idea: "Fruit-machine reels: every card rattles until it stops in turn — left, middle, right — snapping over with a bounce and a gold ring. Keep is the jackpot: a big ring from your card while the others sink into the table.", t: { arrive: 500, reveal: 2050, keep: 650 } });

/* ═════════ gallery state ═════════ */
const G = { idx: 0, theme: "dark", rm: false, rate: 1, seed: 3, picks: [] };
try { const s = JSON.parse(localStorage.getItem("pq-pack-motion") || "null"); if (s) { G.picks = s.picks || []; G.theme = s.theme || "dark"; } } catch {}
const save = () => { try { localStorage.setItem("pq-pack-motion", JSON.stringify({ picks: G.picks, theme: G.theme })); } catch {} };
const RM = () => G.rm || matchMedia("(prefers-reduced-motion: reduce)").matches;
const dur = (ms) => (RM() ? 0 : ms / G.rate);
const hold = (ms) => (RM() ? ms : ms / G.rate);
let PACK = dealPack(G.seed);

/* ═════════ one frame's markup ═════════ */
function backHtml(c) {
  const b = DATA.backs[c.back];
  return `<div class="face back" style="background:${b.root}"><div class="ov" style="background:${b.ov};background-size:${b.ovSize}"></div><div class="wm" style="color:${b.wm}">${DATA.brand}</div><div class="word">${DATA.wordmark}</div><div class="yr">${DATA.season}</div></div>`;
}
function frontHtml(c) {
  return `<div class="face front"><div class="risk" aria-hidden="true">RISK ${[1, 2, 3].map((n) => `<i class="${n <= c.risk ? "on" : ""}"></i>`).join("")}</div><div class="ic">${c.ic}</div><b class="nm">${esc(c.name)}</b><span class="bn">＋ ${esc(c.boon)}</span><span class="ct">− ${esc(c.catch)}</span><span class="stk" aria-hidden="true">KEPT</span></div>`;
}
function tableHtml() {
  const cards = PACK.cards.map((c, i) => `<button class="slot${i === PACK.risky ? " risky" : ""}${i === PACK.safe ? " safe" : ""}" data-i="${i}" style="--i:${i};--gc:${DATA.backs[c.back].glow}" disabled aria-label="Face-down reward"><div class="mv"><div class="ring"></div><div class="sc"><div class="fl">${backHtml(c)}${frontHtml(c)}</div></div></div></button>`).join("");
  return `<div class="tbl" data-ph="arrive"><div class="dim"></div><h3 class="pt">${esc(T.packTitle)}</h3><p class="hint">${esc(T.packHint)}</p>
    <div class="row"><div class="burst"></div><div class="spot"></div>${cards}</div>
    <button class="go">${esc(T.open)}</button>
    <div class="kl"><p></p><button class="again">${esc(T.back)}</button></div></div>`;
}
const frameHtml = (m) => `<div><div class="tag">${m ? "MOBILE · 380px" : "DESKTOP · 1000px"}</div><div class="fr ${m ? "m" : "d"} M${G.idx + 1}">
  <div class="top"><h3>${esc(T.title)}</h3><span class="mut">${esc(fill(T.best, DATA.best))}</span></div><p class="sub">${esc(fill(T.subtitle, { lives: DATA.lives }))}</p>
  <div class="host"></div></div></div>`;

/* ═════════ the per-frame state machine: arrive → closed → reveal → open → keep ═════════ */
const FR = [];
const clearT = (F) => { F.timers.forEach(clearTimeout); F.timers = []; };
const later = (F, ms, fn) => F.timers.push(setTimeout(fn, ms));
function measure(F) {
  const row = F.tbl.querySelector(".row"), slots = [...row.querySelectorAll(".slot")];
  F.c = slots.map((s) => s.offsetLeft + s.offsetWidth / 2);
  const rc = row.clientWidth / 2;
  row.style.setProperty("--rw", `${(F.c[2] - F.c[0]) / 2 + slots[0].offsetWidth / 2}px`);
  slots.forEach((s, i) => {
    const sd = i - 1;
    s.style.setProperty("--dx", `${rc - F.c[i]}px`);
    s.style.setProperty("--sd", sd); s.style.setProperty("--sa", Math.abs(sd));
    s.style.setProperty("--sw", `${F.c[2 - i] - F.c[i]}px`);
    s.style.setProperty("--sc2", i === 1 ? 0.92 : 1);
  });
}
function setPh(F, ph) {
  F.ph = ph; F.tbl.dataset.ph = ph;
  F.tbl.querySelector(".hint").textContent = ph === "arrive" || ph === "closed" ? T.packHint : T.packPick;
  F.tbl.querySelectorAll(".slot").forEach((s, i) => {
    const c = PACK.cards[i]; s.disabled = ph !== "open";
    s.setAttribute("aria-label", ph === "arrive" || ph === "closed" ? "Face-down reward" : `${c.name}: ${c.boon}. Catch: ${c.catch}`);
    s.classList.toggle("kept", ph === "keep" && i === F.kept); s.classList.toggle("gone", ph === "keep" && i !== F.kept);
  });
  if (!RM()) F.root.getAnimations({ subtree: true }).forEach((a) => (a.playbackRate = G.rate));
}
function deal(F, auto) {
  clearT(F); F.kept = -1;
  F.root.querySelector(".host").innerHTML = tableHtml(); F.tbl = F.root.querySelector(".tbl");
  measure(F); setPh(F, "arrive"); fit();
  later(F, dur(D[G.idx].t.arrive), () => { setPh(F, "closed"); if (auto) later(F, hold(700), () => openPack(F, true)); });
}
function openPack(F, auto) {
  if (F.ph !== "arrive" && F.ph !== "closed") return;
  clearT(F); setPh(F, "reveal");
  later(F, dur(D[G.idx].t.reveal), () => { setPh(F, "open"); if (auto) later(F, hold(1300), () => keep(F, PACK.risky)); });
}
function keep(F, k) {
  if (F.ph !== "open") return;
  clearT(F); F.kept = k;
  const row = F.tbl.querySelector(".row");
  row.style.setProperty("--kx", `${F.c[k] - row.clientWidth / 2}px`);
  row.querySelectorAll(".slot").forEach((s, i) => {
    s.style.setProperty("--tk", `${F.c[k] - F.c[i]}px`);
    s.style.setProperty("--away", Math.sign(F.c[i] - F.c[k]) || 0);
    s.style.setProperty("--far", Math.max(0, Math.abs(i - k) - 1));
  });
  const c = PACK.cards[k];
  F.tbl.querySelector(".kl p").innerHTML = `<b>Kept: ${c.ic} ${esc(c.name)}</b> — ${esc(c.boon)}. <span class="c">The catch: ${esc(c.catch)}.</span>`;
  setPh(F, "keep");
  fit(); // the kept line makes the table taller
}
const all = (fn) => FR.forEach(fn);

/* ═════════ gallery chrome ═════════ */
function summary() { return G.picks.length ? `Pack motion ${[...G.picks].sort((a, b) => a - b).map((n) => `#${n} ${D[n - 1].name}`).join(" + ")}` : "Pack motion —"; }
function renderPickbar() {
  const p = [...G.picks].sort((a, b) => a - b);
  document.getElementById("pickbar").innerHTML = `<b>Picks:</b> <span class="p ${p.length ? "on" : ""}">${p.length ? `Pack motion ${p.map((n) => `#${n}`).join(" + ")}` : "Pack motion #—"}</span>${p.length > 1 ? `<span class="p">(hybrid)</span>` : ""} <button id="copy">Copy</button><button id="clear">Clear</button>`;
}
const secs = (ms) => (ms / 1000).toFixed(ms % 1000 ? (ms % 100 ? 2 : 1) : 1);
function render() {
  document.body.dataset.theme = G.theme; document.body.classList.toggle("rm", G.rm);
  const i = G.idx, d = D[i], picked = G.picks.includes(i + 1);
  document.getElementById("concept").innerHTML = D.map((x, j) => `<option value="${j}" ${j === i ? "selected" : ""}>#${j + 1} · ${x.name}</option>`).join("");
  document.getElementById("main").innerHTML = `<p class="intro">/game/market — the Mystery Market pack, on the owner's layout pick <b>Pack #1 "Three-Card Table"</b>. Each design plays the whole moment: cards arrive face-down → <b>${esc(T.open)}</b> → reveal → keep ONE. Replay runs it hands-free (it keeps the riskiest card); "Play it yourself" stops at the closed pack so you can open it and choose. Pick several numbers for a hybrid.</p>
    <p class="rmnote">Reduced motion is ON — this is what a visitor with <code>prefers-reduced-motion: reduce</code> sees: no animation and no transition, every step is instant.</p>
    <div class="chead"><h2><b>#${i + 1}</b>${esc(d.name)}</h2><button class="pickbtn ${picked ? "on" : ""}" id="pick">${picked ? "✓ Picked" : "Pick this one"}</button></div>
    <p class="why">${esc(d.idea)}</p>
    <p class="tl">Arrive ${secs(d.t.arrive)} s · Reveal ${secs(d.t.reveal)} s (Open → choosable) · Keep ${secs(d.t.keep)} s — transform / opacity / box-shadow only, all finite</p>
    <div class="ctl"><button class="pri" data-g="replay">▶ Replay</button><button data-g="manual">Play it yourself</button><button data-g="pack">Deal another pack</button><span>Pack: ${PACK.cards.map((c) => `${c.ic} ${esc(c.name)}`).join(" · ")}</span></div>
    <div class="stage" id="stage"><div class="frames" id="frames">${frameHtml(false)}${frameHtml(true)}</div></div>`;
  FR.length = 0;
  document.querySelectorAll(".fr").forEach((root) => FR.push({ root, timers: [], ph: null, kept: -1 }));
  all((F) => deal(F, true));
  fit(); // after the tables exist, or the stage is sized without them
  renderPickbar();
}
function fit() {
  const st = document.getElementById("stage"), fr = document.getElementById("frames"); if (!st) return;
  const narrow = window.innerWidth < 900;
  fr.style.flexDirection = narrow ? "column" : "row"; fr.style.width = narrow ? "1000px" : "1404px";
  const w = narrow ? 1000 : 1404, z = Math.min(1, st.clientWidth / w);
  fr.style.transform = `scale(${z})`; st.style.height = fr.offsetHeight * z + "px";
}
window.addEventListener("resize", fit);

function seg(id, list, get, set) {
  const el = document.getElementById(id);
  const sync = () => el.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === String(get()))));
  el.innerHTML = list.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; set(b.dataset.v); sync(); };
  sync();
}
seg("theme", [["light", "Light"], ["dark", "Dark"]], () => G.theme, (v) => { G.theme = v; save(); document.body.dataset.theme = v; });
seg("motion", [["full", "Full motion"], ["reduced", "Reduced motion"]], () => (G.rm ? "reduced" : "full"), (v) => { G.rm = v === "reduced"; render(); });
seg("speed", [["1", "1×"], ["0.5", "½×"], ["0.25", "¼×"]], () => G.rate, (v) => { G.rate = +v; render(); });
document.getElementById("concept").onchange = (e) => { G.idx = +e.target.value; render(); };
const step = (d) => { G.idx = (G.idx + d + D.length) % D.length; render(); window.scrollTo({ top: 0 }); };
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", (e) => { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); });

document.getElementById("pickbar").addEventListener("click", (e) => {
  if (e.target.id === "copy") { const t = summary(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => (e.target.textContent = "Copied"), () => prompt("Copy your picks:", t)); }
  if (e.target.id === "clear") { G.picks = []; save(); render(); }
});
document.getElementById("main").addEventListener("click", (e) => {
  if (e.target.id === "pick") { const n = G.idx + 1; G.picks = G.picks.includes(n) ? G.picks.filter((x) => x !== n) : [...G.picks, n]; save(); renderPickbar(); e.target.className = `pickbtn ${G.picks.includes(n) ? "on" : ""}`; e.target.textContent = G.picks.includes(n) ? "✓ Picked" : "Pick this one"; return; }
  const g = e.target.closest("[data-g]");
  if (g) {
    if (g.dataset.g === "replay") all((F) => deal(F, true));
    if (g.dataset.g === "manual") all((F) => deal(F, false));
    if (g.dataset.g === "pack") { G.seed++; PACK = dealPack(G.seed); render(); }
    return;
  }
  const fr = e.target.closest(".fr"); if (!fr) return;
  const F = FR.find((x) => x.root === fr); if (!F) return;
  if (e.target.closest(".go")) { clearT(F); openPack(F, false); return; }
  if (e.target.closest(".again")) { deal(F, false); return; }
  const s = e.target.closest(".slot"); if (s && !s.disabled) keep(F, +s.dataset.i);
});

render();
</script>
</body>
</html>
