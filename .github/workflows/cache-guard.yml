name: Cache guard

# Hosting-cost guardrail.
#
# PitchIQ runs on Vercel Hobby, which includes 4 hours of Fluid Active CPU per
# month. The app is ~1,700 prerendered pages plus ISR, so in a healthy state
# almost every page view is served from the CDN and costs ZERO CPU.
#
# In 2026-07 that silently stopped being true: next-intl's middleware was
# emitting `Set-Cookie: NEXT_LOCALE` on every response, and a response carrying
# Set-Cookie cannot be cached by a shared CDN. Vercel marked every page
# `private, no-store` and returned `x-vercel-cache: MISS`, so EVERY page view
# ran a function. Nothing in the app was visibly broken — it only showed up as
# a usage graph climbing toward a cap that pauses the project.
#
# This job makes that class of regression loud: it asks production for a page
# that must be cacheable, twice, and fails if the CDN is not serving it. Any
# future change that makes responses uncacheable (a cookie, a `headers()` call
# in the root layout, an accidental `dynamic = "force-dynamic"`) trips it within
# a day instead of at the billing cap.
#
# It deliberately probes the DEPLOYED site rather than a build artifact, because
# the fault lives in the interaction between middleware and the CDN and cannot
# be observed locally.

on:
  schedule:
    # 06:00 UTC daily — after the overnight data-refresh deploy has settled.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Origin to probe"
        required: false
        default: "https://pitchiq-pl.vercel.app"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SITE: ${{ github.event.inputs.site || 'https://pitchiq-pl.vercel.app' }}
    steps:
      - name: Probe CDN cacheability
        shell: bash
        run: |
          set -uo pipefail

          fail=0

          # Ask twice: the first request may legitimately populate the cache
          # (MISS/STALE), but the second must be served by the CDN (HIT).
          check() {
            local label="$1" path="$2"
            local status cache cc

            curl -sS -o /dev/null -D /tmp/h1 --max-time 30 "$SITE$path" || true
            sleep 3
            curl -sS -o /dev/null -D /tmp/h2 --max-time 30 "$SITE$path" || true

            status=$(head -1 /tmp/h2 | tr -d '\r' | awk '{print $2}')
            cache=$(tr -d '\r' < /tmp/h2 | grep -i '^x-vercel-cache:' | awk '{print $2}')
            cc=$(tr -d '\r' < /tmp/h2 | grep -i '^cache-control:' | cut -d' ' -f2-)

            echo "── $label ($path)"
            echo "   status=$status  x-vercel-cache=${cache:-<none>}"
            echo "   cache-control=${cc:-<none>}"

            if [ "$status" != "200" ]; then
              echo "   ::error::expected HTTP 200, got $status"
              fail=1
              return
            fi

            # The specific fingerprint of the 2026-07 outage.
            if tr -d '\r' < /tmp/h2 | grep -qi '^set-cookie:'; then
              echo "   ::error::response sets a cookie — this makes it UNCACHEABLE at the CDN."
              echo "   ::error::Check src/i18n/routing.ts (localeCookie must stay false)."
              fail=1
            fi

            if printf '%s' "$cc" | grep -qiE 'no-store|private'; then
              echo "   ::error::cache-control is '$cc' — the page is being rendered dynamically."
              fail=1
            fi

            if [ "$cache" != "HIT" ] && [ "$cache" != "STALE" ]; then
              echo "   ::error::x-vercel-cache=${cache:-<none>} on a repeat request."
              echo "   ::error::Every page view is costing Fluid Active CPU. See docs/hosting-cost.md."
              fail=1
            fi
          }

          # Same probe as check(), but REPORT-ONLY: for routes we already know
          # are dynamic and have a ticket open for. Keeping them visible means
          # the log still shows the whole picture; not failing on them means a
          # red run always signals a genuine REGRESSION rather than a known gap.
          # A guard that is red every morning stops being read.
          #
          # It does assert HTTP 200 — a known-dynamic page is still allowed to
          # be dynamic, but it is NOT allowed to be broken.
          note() {
            local label="$1" path="$2" ticket="$3"
            local status cache cc

            curl -sS -o /dev/null -D /tmp/h1 --max-time 30 "$SITE$path" || true
            sleep 3
            curl -sS -o /dev/null -D /tmp/h2 --max-time 30 "$SITE$path" || true

            status=$(head -1 /tmp/h2 | tr -d '\r' | awk '{print $2}')
            cache=$(tr -d '\r' < /tmp/h2 | grep -i '^x-vercel-cache:' | awk '{print $2}')
            cc=$(tr -d '\r' < /tmp/h2 | grep -i '^cache-control:' | cut -d' ' -f2-)

            echo "── $label ($path) — KNOWN DYNAMIC, tracked in $ticket"
            echo "   status=$status  x-vercel-cache=${cache:-<none>}"
            echo "   cache-control=${cc:-<none>}"

            if [ "$status" != "200" ]; then
              echo "   ::error::expected HTTP 200, got $status"
              fail=1
              return
            fi

            if [ "$cache" = "HIT" ] || [ "$cache" = "STALE" ]; then
              echo "   ::notice::$path is now CDN-served — $ticket may be done. Promote it to check()."
            else
              echo "   ::warning::$path still costs an invocation per view ($ticket)."
            fi
          }

          # A 404 cannot be prerendered, so every unknown URL used to run a Node
          # function to produce one — measured on production 2026-08-27 against
          # /wp-login.php, /.env, /wp-admin and /.git/config, all MISS on every
          # request. `src/middleware.ts` now answers scanner shapes at the edge.
          #
          # ⛔ This is the only place that can test it. `probe-path.test.ts` covers
          # the PREDICATE, but whether those paths ever REACH middleware is decided
          # by the matcher regexes in `config`, and nothing but a running server can
          # tell you that. A broken matcher does not error — it silently goes back
          # to paying a render per probe.
          #
          # A TINY body is the fingerprint: our middleware returns a bare status (0B),
          # Vercel's platform firewall a ~59B deny — the branded not-found page is ~100 KB,
          # and only that last one means a function ran.
          scanner() {
            local label="$1" path="$2" status len

            status=$(curl -sS -o /tmp/b404 -w '%{http_code}' --max-time 30 "$SITE$path" || echo 000)
            len=$(wc -c < /tmp/b404 | tr -d ' ')

            echo "── $label ($path)"
            echo "   status=$status  body=${len}B"

            # ⚠️ The assertion is "a scanner probe never buys a render", and BODY SIZE is the
            # honest fingerprint — not which layer said no. Two answers are both correct:
            #   404 + empty  — our middleware short-circuit
            #   403 + tiny   — Vercel's platform firewall, which sits UPSTREAM of the app and
            #                  denies some scanner shapes on its own (measured 2026-08-27:
            #                  /wp-login.php drew a 59B platform 403 while /.env fell through
            #                  to our middleware — and which shapes it covers can change
            #                  without notice, so the probe must accept either layer).
            # The failure mode is a LARGE body on any status: that means a React render ran.
            if [ "$status" != "404" ] && [ "$status" != "403" ]; then
              echo "   ::error::expected HTTP 404 (middleware) or 403 (platform firewall), got $status"
              fail=1
            elif [ "$len" -gt 1000 ]; then
              echo "   ::error::a scanner probe drew a ${len}B response — a page RENDERED, so the"
              echo "   ::error::middleware matcher is no longer catching it and every probe is"
              echo "   ::error::costing Active CPU. Check src/middleware.ts config + probe-path.ts."
              fail=1
            fi
          }

          # The other half: a MISTYPED real URL must still get the branded page.
          # If this one comes back empty, the denylist has grown teeth it should
          # not have and ordinary visitors are getting a bare edge 404.
          branded404() {
            local label="$1" path="$2" status len

            status=$(curl -sS -o /tmp/b404 -w '%{http_code}' --max-time 30 "$SITE$path" || echo 000)
            len=$(wc -c < /tmp/b404 | tr -d ' ')

            echo "── $label ($path)"
            echo "   status=$status  body=${len}B"

            if [ "$status" != "404" ]; then
              echo "   ::error::expected HTTP 404, got $status"
              fail=1
            elif [ "$len" -lt 1000 ]; then
              echo "   ::error::a mistyped URL got a ${len}B bare 404 instead of the branded page."
              echo "   ::error::Check the denylist in src/utils/probe-path.ts."
              fail=1
            fi
          }

          # ENFORCED — these must stay CDN-served. A prerendered entity page
          # (the highest-traffic route), its Arabic twin, a route that
          # bypasses middleware entirely (the control — if that one fails, the
          # problem is not middleware), and — since TASK-M71a — the dashboard
          # and the season pages (verified HIT + public on 2026-07-30 after
          # PR #64 deployed).
          check "player profile (prerendered)" "/players/1001119"
          check "player profile — Arabic"      "/ar/players/1001119"
          check "robots.txt (middleware-exempt control)" "/robots.txt"
          check "dashboard"                    "/"
          check "seasons directory"            "/seasons"
          check "a historical season"          "/seasons/2003"
          # TASK-M71c — the last two entity routes, prerendered as of PR #70
          # (verified HIT + public on production 2026-07-30).
          check "team profile"                 "/teams/42"
          check "manager profile"              "/managers/58"
          # TASK-M71b — the section indexes, prerendered as of PR #74 (verified
          # HIT + public on production 2026-07-30). With these, every route in
          # the app is CDN-served except /compare (which genuinely needs
          # searchParams and stays dynamic by design).
          check "teams index"                  "/teams"
          check "a historical season-section"  "/seasons/2003/teams"
          # TASK-1810 — the game routes, which this guard had never covered at all
          # even though `/game/*` is where the app is still growing. The two
          # PARAMETERISED ones matter most: `/game/[mode]` and `/game/[mode]/[club]`
          # prerender from `generateStaticParams`, and a route whose params silently
          # stop being generated does not error — it falls back to rendering on
          # demand, which is precisely the 2026-07 shape. 102 club pages hang off
          # the second one, so it is the single highest-leverage probe here.
          check "the game gate"                "/game"
          check "legacy club menu"             "/game/legacy"
          check "legacy club draft"            "/game/legacy/40"
          check "legacy club draft — Arabic"   "/ar/game/legacy/40"

          # Scanner traffic answered at the edge instead of by a Node render.
          scanner    "scanner — wordpress login"  "/wp-login.php"
          scanner    "scanner — dotfile"          "/.env"
          scanner    "scanner — dot-directory"    "/.git/config"
          scanner    "scanner — no extension"     "/wp-admin"
          # …and the visitor-facing half, which must NOT be short-circuited.
          branded404 "a mistyped page"            "/playerz"

          echo
          if [ "$fail" -ne 0 ]; then
            echo "::error::CDN caching is BROKEN in production — page views are burning Fluid Active CPU."
            exit 1
          fi
          echo "✅ CDN is serving cached responses on the enforced routes; page views cost no Active CPU."
